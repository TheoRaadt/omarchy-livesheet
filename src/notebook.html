      // first row through the UI) — "otherwise" has to be just as usable
      // as "if" per §6 of the spec, not a dead branch.
      if (kind === "if") {
        stmt.thenBody.push(createStatementObject("assign"));
        stmt.elseBody.push(createStatementObject("assign"));
      } else {
        stmt.body.push(createStatementObject("assign"));
      }
      loc.list.splice(loc.index + 1, 0, stmt);
      renderStatement(progLine, stmt, loc.parentEl, atStmt.el.nextSibling);
      (kind === "for" ? stmt.varField : stmt.condField).focus();
    }

    // Inserts a break/continue/return statement right after whichever
    // statement currently contains the focused field, at THAT
    // statement's own level (top-level or nested — unlike
    // insertStructural() above, these are always allowed at either
    // level: break/continue only make runtime sense inside a loop body,
    // but that's enforced by runProgram()'s own "used outside a loop"
    // error at evaluation time, not by refusing to let the UI insert one
    // somewhere that would be wrong — the same "catch it when it
    // actually runs, not when it's typed" philosophy this evaluator
    // already applies to e.g. an undefined variable).
    function insertKeywordStatement(progLine, atStmt, kind) {
      var loc = locateStatement(progLine, atStmt);
      if (!loc) return;
      var stmt = createStatementObject(kind);
      loc.list.splice(loc.index + 1, 0, stmt);
      renderStatement(progLine, stmt, loc.parentEl, atStmt.el.nextSibling);
      if (stmt.field) stmt.field.focus();
    }

    // Resolves a raw DOM event target to the program-field back-
    // reference createProgramField() stamped on it, or null — the
    // program-tree analogue of the matrix-cell block's own
    // `cellEl._line` resolution further down in the global keydown
    // listener.
    function resolveProgramField(target) {
      var el = target.closest ? target.closest(".program-field") : null;
      return el && el._progField ? el._progField : null;
    }

    // The "=" trigger for a BARE program block (§10 of the spec: display
    // mechanism matches the final value's type, reusing exactly
    // appendMatrixResult()/appendFormulaResult() — no new display
    // mechanism built). Only ever called for the program's own LAST
    // top-level statement's field (see the global keydown listener's own
    // gate for this) — `lastStmt`/`lastStmtLatex` let runProgram() read
    // that one statement's CAPTURED pre-"=" text instead of its live
    // field (which, by the time this runs, already has "=" typed into
    // it — see the caller's own comment for why "capture before, type
    // after" has to happen in this order, the same sequencing
    // insertChar()'s own "=" branch already uses for an ordinary math
    // line). A matrix result is never possible here directly — only via
    // a bare scalar program whose value happens to be a matrix (e.g. a
    // program that just returns a named matrix variable) — appendFormulaResult()
    // is unreachable in practice (no symbolic-tree value a program can
    // produce), listed anyway for exact parity with evaluateAndAppend()'s
    // own three-way dispatch.
    function evaluateProgramAndAppend(progLine, triggerField, lastStmt, lastStmtLatex) {
      try {
        var defs = collectDefinitions(progLine);
        var result = runProgram(progLine, defs.vars, defs.funcs, lastStmt, lastStmtLatex);
        if (isMatrixValue(result)) appendMatrixResult(progLine, result.rows);
        else triggerField.typedText(formatNumber(result));
      } catch (e) { /* leave just the "=" , same convention as evaluateAndAppend */ }
    }

    // Export degradation for a program block (collectDocument()'s
    // "program" case below) — there's no real LaTeX program-block
    // environment to target (same situation renderGraph's own export
    // comment describes for a plotted curve: no pgfplots-equivalent in
    // scope), so this flattens the statement tree into readable
    // \text{...}-labelled LaTeX, best-effort, never fed back into
    // MathQuill itself (only ever handed to the C++ Backend for export,
    // same as matrixLatex()'s \begin{bmatrix} string above, which
    // MathQuill can't render either — see that function's own comment).
    function programExportLatex(line) {
      function stmtLatex(stmt) {
        if (stmt.kind === "assign") return stmt.field.latex();
        if (stmt.kind === "return") return "\\text{return }" + stmt.field.latex();
        if (stmt.kind === "break") return "\\text{break}";
        if (stmt.kind === "continue") return "\\text{continue}";
        if (stmt.kind === "for") {
          return "\\text{for }" + stmt.varField.latex() + "\\in " + stmt.collField.latex() +
            "\\text{: }" + stmt.body.map(stmtLatex).join(",\\ ");
        }
        if (stmt.kind === "while") {
          return "\\text{while }" + stmt.condField.latex() +
            "\\text{: }" + stmt.body.map(stmtLatex).join(",\\ ");
        }
        if (stmt.kind === "if") {
          return "\\text{if }" + stmt.condField.latex() + "\\text{: }" + stmt.thenBody.map(stmtLatex).join(",\\ ") +
            "\\text{ otherwise: }" + stmt.elseBody.map(stmtLatex).join(",\\ ");
        }
        return "";
      }
      var body = line.statements.map(stmtLatex).join(",\\ ");
      var prefix = line.fnName ? line.fnName + "(" + line.fnParams.join(",") + "):=" : "";
      return prefix + "\\left\\{" + body + "\\right\\}";
    }

    // A graph always plots over this fixed, symmetric x-domain — no axis-
    // limit placeholders to fill in, unlike a real Mathcad X-Y plot. Kept
    // simple on purpose: GRAPH_SAMPLES points are evaluated on every
    // keystroke (see convertToGraph()'s "edit" handler), which is cheap
    // enough for live updates at this count but wouldn't stay that way at
    //, say, 10x as many.
    var GRAPH_DOMAIN = 10;
    var GRAPH_SAMPLES = 200;
    // A 3D surface samples a GRAPH3D_SAMPLES x GRAPH3D_SAMPLES grid over
    // the same domain on both axes, evaluating the expression once per
    // grid point (225 at the default, vs. 201 for a 2D curve) on every
    // keystroke. Far fewer samples per axis than the 2D case: a wireframe
    // mesh gets visually denser, not more accurate, as you add lines —
    // past about 15-20 per axis it just reads as noise — and it's an N^2
    // cost instead of 2D's N, so keeping it modest matters more here.
    var GRAPH3D_SAMPLES = 15;

    // Draws one straight-line SVG <line> element — the building block
    // both axis lines in renderGraph() are made of.
    function appendGraphLine(svg, x1, y1, x2, y2) {
      var el = document.createElementNS(svg.namespaceURI, "line");
      el.setAttribute("x1", x1);
      el.setAttribute("y1", y1);
      el.setAttribute("x2", x2);
      el.setAttribute("y2", y2);
      el.setAttribute("class", "graph-axis");
      svg.appendChild(el);
    }

    // Decides whether a graph's expression is a 2D curve y=f(x) or a 3D
    // surface z=f(x,y): the same "y" letter means different things in
    // each (the plotted axis variable vs. an ordinary undefined
    // variable), and there's no separate shortcut to tell them apart —
    // the expression itself decides, the same way it already decides
    // whether to call a user-defined function or just multiply by a
    // letter. Evaluates one sample with "x" bound (same as the 2D path
    // always does) and "y" left exactly as collectDefinitions() found it
    // (undefined, unless an earlier line like "y:=5" already defines
    // it). If that throws specifically because "y" itself is the
    // undefined reference, the expression must be using "y" as a second
    // free variable — i.e. a 3D surface — so switch modes. Any other
    // outcome (no throw at all, because "y" isn't referenced or is
    // already a defined value; or a throw for an unrelated reason, e.g.
    // some other undefined letter) leaves it as an ordinary 2D curve,
    // exactly like before this existed.
    function detectGraphMode(exprLatex, defs) {
      var testVars = {};
      for (var k in defs.vars) testVars[k] = defs.vars[k];
      testVars.x = 0;
      try {
        evaluateLatex(exprLatex, testVars, defs.funcs);
        return "2d";
      } catch (e) {
        return e.message === "undefined variable y" ? "3d" : "2d";
      }
    }

    // Samples the graph's expression across [-GRAPH_DOMAIN, GRAPH_DOMAIN],
    // binding "x" to each sample on top of whatever collectDefinitions()
    // finds above this line (so a graph can plot a previously-defined
    // function, e.g. "f(x)", the same way any other line could call one),
    // and redraws the SVG from scratch. A sample that can't be evaluated
    // (an undefined reference, 1/0, a range-variable result rather than a
    // plain number, ...) breaks the curve there instead of drawing a
    // spurious straight segment across the gap — the same idea as an
    // asymptote not being connected across itself on a real graph.
    //
    // Dispatches to renderGraph3D() instead when detectGraphMode() finds
    // the expression is actually a surface z=f(x,y) rather than a plain
    // curve — see that function for the detection rule. Either way the
    // "y ="/"z =" label to the left of the field is kept in sync here,
    // live on every edit, since the mode can only be known after
    // evaluating, not when the line was first created.
    function renderGraph(line) {
      var svg = line.svg;
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      var exprLatex = line.mathField.latex();
      if (!exprLatex) return;
      var defs = collectDefinitions(line);

      var mode = detectGraphMode(exprLatex, defs);
      line.graphMode = mode;
      line.yLabelEl.textContent = mode === "3d" ? "z =" : "y =";
      if (mode === "3d") { renderGraph3D(line, exprLatex, defs); return; }

      var points = [];
      for (var i = 0; i <= GRAPH_SAMPLES; i++) {
        var x = -GRAPH_DOMAIN + (2 * GRAPH_DOMAIN * i) / GRAPH_SAMPLES;
        var vars = freshBuiltinVars();
        vars.x = x;
        for (var k in defs.vars) if (k !== "x") vars[k] = defs.vars[k];
        try {
          var y = evaluateLatex(exprLatex, vars, defs.funcs);
          points.push(typeof y === "number" && isFinite(y) ? [x, y] : null);
        } catch (e) {
          points.push(null);
        }
      }

      var finiteYs = [];
      for (var p = 0; p < points.length; p++) if (points[p]) finiteYs.push(points[p][1]);
      if (finiteYs.length === 0) return; // nothing plottable yet; leave it blank

      var yMin = Math.min.apply(null, finiteYs), yMax = Math.max.apply(null, finiteYs);
      if (yMin === yMax) { yMin -= 1; yMax += 1; } // a flat line still gets visible room
      var padding = (yMax - yMin) * 0.1;
      yMin -= padding; yMax += padding;

      var W = 600, H = 300;
      function toPx(px, py) {
        return [
          ((px + GRAPH_DOMAIN) / (2 * GRAPH_DOMAIN)) * W,
          H - ((py - yMin) / (yMax - yMin)) * H
        ];
      }

      // The vertical (x=0) axis is always in view — the domain is fixed
      // and symmetric around 0 — but the horizontal (y=0) one only is if
      // the auto-scaled y-range actually reaches 0.
      var originPx = toPx(0, 0);
      appendGraphLine(svg, originPx[0], 0, originPx[0], H);
      if (yMin <= 0 && 0 <= yMax) appendGraphLine(svg, 0, originPx[1], W, originPx[1]);

      // The curve itself, as one or more polylines: a run of consecutive
      // plottable points becomes one <polyline>, and a gap (a null from
      // the sampling loop above) ends the current one and starts a new
      // one on the far side, leaving a visible break.
      var segment = [];
      function flushSegment() {
        if (segment.length > 1) {
          var poly = document.createElementNS(svg.namespaceURI, "polyline");
          poly.setAttribute("points", segment.map(function (pt) {
            var px = toPx(pt[0], pt[1]);
            return px[0] + "," + px[1];
          }).join(" "));
          poly.setAttribute("class", "graph-curve");
          svg.appendChild(poly);
        }
        segment = [];
      }
      for (var j = 0; j < points.length; j++) {
        if (points[j]) segment.push(points[j]);
        else flushSegment();
      }
      flushSegment();
    }

    // Renders a 3D surface z=f(x,y) as an SVG wireframe mesh — this
    // project has no graphing/3D library and no build step to add one
    // with, so the mesh is just a grid of <polyline>s, projected by
    // hand, drawn in the same monochrome currentColor style as
    // everything else. Called from renderGraph() once detectGraphMode()
    // has decided the expression needs both "x" and "y" as free
    // variables; "x" and "y" are bound here across the sample grid the
    // same way renderGraph() always binds "x" for a 2D curve — each one
    // overriding any same-named entry collectDefinitions() found above
    // this line, per the usual rule that the plotted axis variable(s)
    // always win.
    function renderGraph3D(line, exprLatex, defs) {
      var svg = line.svg;
      var N = GRAPH3D_SAMPLES;

      // grid[i][j] is {x, y, z} for a plottable point, or null for one
      // that threw (undefined elsewhere in the expression, a range
      // result, non-finite, ...) — same "leave a gap, don't draw a
      // spurious line across it" idea as the 2D curve's null points,
      // just checked in both mesh directions below instead of one.
      var grid = [], zs = [];
      for (var i = 0; i < N; i++) {
        var gx = -GRAPH_DOMAIN + (2 * GRAPH_DOMAIN * i) / (N - 1);
        var row = [];
        for (var j = 0; j < N; j++) {
          var gy = -GRAPH_DOMAIN + (2 * GRAPH_DOMAIN * j) / (N - 1);
          var vars = freshBuiltinVars();
          vars.x = gx; vars.y = gy;
          for (var k in defs.vars) if (k !== "x" && k !== "y") vars[k] = defs.vars[k];
          try {
            var z = evaluateLatex(exprLatex, vars, defs.funcs);
            row.push(typeof z === "number" && isFinite(z) ? { x: gx, y: gy, z: z } : null);
          } catch (e) {
            row.push(null);
          }
          if (row[j]) zs.push(row[j].z);
        }
        grid.push(row);
      }
      if (zs.length === 0) return; // nothing plottable yet; leave it blank

      var zMin = Math.min.apply(null, zs), zMax = Math.max.apply(null, zs);
      if (zMin === zMax) { zMin -= 1; zMax += 1; } // a flat plane still gets visible relief
      var zMid = (zMin + zMax) / 2, zHalfRange = (zMax - zMin) / 2;

      // A fixed isometric projection: x and y each tilt 30° off the
      // horizontal (the standard isometric angle) in opposite screen
      // directions, and z simply moves a point straight up the screen —
      // scaled by zRelief against the normalized x/y footprint so the
      // surface's height reads as proportionate to it rather than
      // dwarfing or vanishing into it regardless of the actual z-range
      // (which is why z is normalized by the *computed* range here,
      // the 3D equivalent of the 2D curve's y-axis auto-scaling).
      var COS30 = Math.cos(Math.PI / 6), SIN30 = Math.sin(Math.PI / 6);
      var zRelief = 0.9;
      function project(pt) {
        var nx = pt.x / GRAPH_DOMAIN, ny = pt.y / GRAPH_DOMAIN;
        var nz = (pt.z - zMid) / zHalfRange;
        return [(nx - ny) * COS30, (nx + ny) * SIN30 - nz * zRelief];
      }

      // The projected footprint's size and position on screen vary with
      // the data (a steep surface projects "taller" than a flat one), so
      // fit/center it into the viewport from its own bounding box — the
      // 3D analogue of the 2D curve's y-axis auto-scaling, just in both
      // projected dimensions instead of one.
      var minPX = Infinity, maxPX = -Infinity, minPY = Infinity, maxPY = -Infinity;
      for (var pi = 0; pi < N; pi++) {
        for (var pj = 0; pj < N; pj++) {
          var cell = grid[pi][pj];
          if (!cell) continue;
          var p = project(cell);
          if (p[0] < minPX) minPX = p[0];
          if (p[0] > maxPX) maxPX = p[0];
          if (p[1] < minPY) minPY = p[1];
          if (p[1] > maxPY) maxPY = p[1];
        }
      }

      var W = 600, H = 300;
      var spanX = (maxPX - minPX) || 1, spanY = (maxPY - minPY) || 1;
      var scale = Math.min((W * 0.85) / spanX, (H * 0.85) / spanY);
      var centerPX = (minPX + maxPX) / 2, centerPY = (minPY + maxPY) / 2;
      function toPx(pt) {
        var p = project(pt);
        return [W / 2 + (p[0] - centerPX) * scale, H / 2 + (p[1] - centerPY) * scale];
      }

      // One mesh line per row and per column — a run of consecutive
      // plottable grid points becomes one <polyline>, broken (a new
      // polyline started) at any null, the same gap-on-failure rule the
      // 2D curve uses, just applied along each line of the grid
      // separately instead of one single sequence.
      function drawMeshLine(cells) {
        var segment = [];
        function flush() {
          if (segment.length > 1) {
            var poly = document.createElementNS(svg.namespaceURI, "polyline");
            poly.setAttribute("points", segment.map(function (pt) {
              var px = toPx(pt);
              return px[0] + "," + px[1];
            }).join(" "));
            poly.setAttribute("class", "graph-mesh");
            svg.appendChild(poly);
          }
          segment = [];
        }
        for (var c = 0; c < cells.length; c++) {
          if (cells[c]) segment.push(cells[c]); else flush();
        }
        flush();
      }
      for (var ri = 0; ri < N; ri++) drawMeshLine(grid[ri]); // rows: fixed x, varying y
      for (var cj = 0; cj < N; cj++) {                       // columns: fixed y, varying x
        var col = [];
        for (var ci = 0; ci < N; ci++) col.push(grid[ci][cj]);
        drawMeshLine(col);
      }
    }

    // Turns a pending line into a graph: Mathcad's own bare "@" shortcut
    // for inserting an X-Y plot. Unlike a real Mathcad plot (which has
    // separate placeholders for the axis limits too), this always plots
    // over the fixed domain above and auto-scales the y-axis to fit —
    // one placeholder (the expression) rather than several, in keeping
    // with how small the rest of this app's own shortcuts are kept.
    //
    // The same expression field doubles as a 3D surface plot (z = f(x,y))
    // when the typed expression actually uses "y" as a second free
    // variable — see renderGraph()'s mode detection. There's no separate
    // shortcut for that; the label just switches from "y =" to "z ="
    // live, which is why it's a span renderGraph() can update rather
    // than a fixed string set once here.
    function convertToGraph(line) {
      var container = document.createElement("div");
      container.className = "line graph-line";
      line.el.replaceWith(container);
      line.el = container;
      line.type = "graph";
      line.graphMode = "2d";

      var exprRow = document.createElement("span");
      exprRow.className = "graph-expr";
      var yLabel = document.createElement("span");
      yLabel.className = "graph-ylabel";
      yLabel.textContent = "y =";
      line.yLabelEl = yLabel;
      var exprEl = document.createElement("span");
      exprRow.appendChild(yLabel);
      exprRow.appendChild(exprEl);
      container.appendChild(exprRow);

      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "graph-plot");
      svg.setAttribute("viewBox", "0 0 600 300");
      container.appendChild(svg);
      line.svg = svg;

      var mathField = MQ.MathField(exprEl, {
        handlers: {
          enter: function () { onEnter(line); },
          deleteOutOf: function (dir) { onDeleteOutOf(line, dir); },
          moveOutOf: function (dir) { onMoveOutOf(line, dir); },
          edit: function () { renderGraph(line); completionOnFieldEdited(mathField); }
        }
      });
      line.mathField = mathField;
      container._line = line;
      mathField.focus();
    }

    // Enter/Backspace for a plain contenteditable line — used by pending
    // lines and (since convertToHeading never replaces the element, only
    // its class/content) heading lines too. Enter always inserts a new
    // line below; Backspace only does something special when the line is
    // already empty, in which case it removes the line and lands the
    // cursor at the end of whatever's above it. A non-empty line's
    // Backspace is left alone, so it just deletes text normally.
    function wireLineKeydown(line) {
      line.el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          onEnter(line);
        } else if (e.key === "Backspace" && line.el.textContent === "") {
          var i = indexOf(line);
          if (i > 0) {
            e.preventDefault();
            var prev = lines[i - 1];
            removeLine(line);
            focusLine(prev, true);
          }
        }
      });
    }

    // Watches a pending line's typed text to decide what it's going to
    // become — this is the whole "type # for a heading, / for a fraction"
    // trigger mechanism. Runs on every keystroke until the line commits to
    // a type, at which point this listener's `line.type !== "pending"`
    // check above makes it a no-op forever after.
    function wirePendingInput(line) {
      line.el.addEventListener("input", function () {
        if (line.type !== "pending") return;
        var text = line.el.textContent;
        if (text === "[") {
          line.el.textContent = "";
          convertToMatrix(line);
          return;
        }
        // A bare program block (TODO.md's "program blocks" item). "{"
        // was the proposed, confirmed-unclaimed shortcut (see §8's own
        // note) — the program-block analogue of "[" for a matrix.
        if (text === "{") {
          line.el.textContent = "";
          convertToProgram(line);
          return;
        }
        // Mathcad's own bare shortcut for inserting an X-Y plot.
        if (text === "@") {
          line.el.textContent = "";
          convertToGraph(line);
          return;
        }
        // "#", "##", or "###" alone might still be building up to "# ",
        // "## ", or "### " (a heading marker), so wait for more input
        // rather than treating a bare "#" as the start of a math
        // expression.
        if (/^#{1,3}$/.test(text)) return;
        // The character class in this pattern (rather than a literal
        // space) matches both a normal space and " ", because a
        // contenteditable div sometimes substitutes a non-breaking space
        // for a trailing regular one — without this, "# " wouldn't
        // reliably match and the line would fall through to becoming a
        // math line instead.
        var headingMatch = text.match(/^(#{1,3})[  ]$/);
        if (headingMatch) {
          convertToHeading(line, headingMatch[1].length);
          return;
        }
        // Anything else means this line is math: hand the typed-so-far
        // text to convertToMath(), which replays it through insertChar()
        // so e.g. a lone "/" still opens a fraction immediately.
        line.el.textContent = "";
        convertToMath(line, text);
      });
    }

    // Creates one new, undecided ("pending") line, appends it to the
    // notebook (both the DOM and the `lines` array), and wires up its
    // keydown/input handling. The line stays pending until
    // wirePendingInput's listener above converts it to something else.
    function createPendingLine() {
      var el = document.createElement("div");
      el.className = "line pending";
      el.contentEditable = "true";
      el.spellcheck = false;
      notebook.appendChild(el);
      var line = { el: el, type: "pending", mathField: null };
      el._line = line;
      lines.push(line);
      wireLineKeydown(line);
      wirePendingInput(line);
      return line;
    }

    // Flips the page between its default dark sheet and a white-paper/
    // black-ink look — see the "body.paper" CSS rule above for what that
    // actually changes. Session-only (not saved anywhere): this app has
    // no settings storage, so it's back to the dark sheet on next launch,
    // the same way the window size/position aren't remembered either.
    function togglePaperMode() {
      document.documentElement.classList.toggle("paper");
    }

    // Resolves "the MathQuill field the Greek-letter shortcut below should
    // insert into" from a raw keydown event's target — the same matrix-
    // cell-vs-line resolution the rest of this listener already does
    // further down (cellEl/hostLineEl), pulled out here since the
    // Greek-letter check needs just the field itself, not also the cell's
    // row/column the matrix-key handling further down needs. Returns null
    // for anything that isn't a math-line, graph-line, or matrix-cell
    // field — e.g. a heading or pending line — so the shortcut is simply
    // not handled there (falls through to whatever the browser/contenteditable
    // would otherwise do with that Ctrl combo).
    function resolveMathField(target) {
      // A program-field (TODO.md's "program blocks" item) first, same
      // position in this resolution chain as the matrix-cell check right
      // below it — both are "a smaller field nested inside a bigger line
      // object" shapes, checked ahead of the plain math-line/graph-line
      // case.
      var progEl = target.closest ? target.closest(".program-field") : null;
      if (progEl && progEl._progField) return progEl._progField.field;
      var cellEl = target.closest ? target.closest(".matrix-cell") : null;
      if (cellEl && cellEl._line) return cellEl._line.rows[cellEl._row][cellEl._col];
      var hostLineEl = target.closest ? target.closest(".math-line, .graph-line") : null;
      var hostLine = hostLineEl && hostLineEl._line;
      return hostLine ? hostLine.mathField : null;
    }

    // --- Inline code-completion for built-in function names ---------------
    // See TODO.md's "inline code-completion for built-in function names"
    // item for the full design history (two pivots: an F1 command-palette
    // idea, then "code-completion like" instead) and scoping decisions
    // (built-in function names only, v1; no Greek-letter-by-name
    // completion — that needs a delete-and-substitute insertion, a
    // different and riskier mechanism than "finish typing the rest of this
    // string", so it's deliberately not built here).
    //
    // The candidate list is built FROM the evaluator's own data (not a
    // separate hand-maintained list that could drift out of sync with what
    // parseAtom() actually accepts): every NATIVE_BUILTINS entry (stripped
    // of its leading "\\", since that's the plain text MathQuill's
    // autoOperatorNames recognizes as the user types it — "sinh", not
    // "\\sinh"), "det" (native too, but handled as its own eat("\\det")
    // branch in parseAtom rather than living in the NATIVE_BUILTINS table,
    // so it's added explicitly here), every WRAPPED_BUILTINS key, and the
    // literal-substring-gated-on-"(" names (trace/solve/mean/median/
    // variance/stdev) that aren't in MathQuill's own table at all — see
    // PROGRESS.md's matrix-functions/statistical-functions entries for why
    // those specific names are exactly the ones worth completing: they
    // render as plain, unconfirmed italic letters with no visual feedback
    // until the trailing "(" triggers them, unlike "sin"/"det".
    // transpose/inverse are deliberately absent: they're "^T"/"^-1"
    // operators on a matrix base (see parsePow), not typed function names
    // — there's nothing to complete.
    var BUILTIN_FUNCTION_NAMES = (function () {
      var names = [];
      NATIVE_BUILTINS.forEach(function (entry) { names.push(entry[0].slice(1)); });
      names.push("det");
      for (var k in WRAPPED_BUILTINS) names.push(k);
      names.push("trace", "solve", "mean", "median", "variance", "stdev");
      return names;
    })();
    // Below 2 typed characters, almost every letter matches *something*
    // (e.g. "s" alone is a prefix of sin/sinh/sec/sech/...) — noisy enough
    // on the very first keystroke of an ordinary one-letter variable name
    // that it would pop up constantly for no reason. 2 is the smallest
    // threshold that avoids that while still triggering early (e.g. "de"
    // already narrows to just "det").
    var MIN_COMPLETION_CHARS = 2;

    // All the completion feature's live state, in one place. `field` is
    // the MathQuill field (MQ.MathField instance — the same object
    // resolveMathField() above already returns for math-line/graph-line/
    // matrix-cell alike) currently being tracked, or null when nothing is.
    // `buffer` is NOT derived from the field's own LaTeX/DOM — see the
    // comment on the keydown handling below for why it's tracked as a
    // separate plain string instead.
    var completion = { field: null, buffer: "", matches: [], highlight: 0, dropdownEl: null };

    // Closes the dropdown's DOM without forgetting what's being typed —
    // used when the buffer stops matching anything but might start
    // matching again on the next keystroke (e.g. backspacing "mex" back
    // down to "me"), so the dropdown can silently reappear instead of
    // needing a whole fresh word to retrigger it.
    function hideCompletionDropdown() {
      if (completion.dropdownEl) { completion.dropdownEl.remove(); completion.dropdownEl = null; }
      completion.matches = [];
      completion.highlight = 0;
    }
    // Stops tracking entirely — any key that isn't a letter continuing the
    // current word, a field/focus change, or Escape.
    function resetCompletion() {
      hideCompletionDropdown();
      completion.field = null;
      completion.buffer = "";
    }
    function completionMatchesFor(buffer) {
      if (buffer.length < MIN_COMPLETION_CHARS) return [];
      var matches = BUILTIN_FUNCTION_NAMES.filter(function (name) { return name.indexOf(buffer) === 0; });
      // Shortest match first (ties broken alphabetically): if the buffer
      // already spells a complete name ("sin"), that name's own remaining-
      // characters-to-type is empty, which makes it the shortest possible
      // match and therefore first/highlighted by default — without this,
      // NATIVE_BUILTINS' own ordering (sinh before sin, since sinh/cosh/
      // tanh/coth are listed first to satisfy parseAtom's greedy-match
      // ordering) would put "sinh" first instead, so pressing Enter right
      // after typing exactly "sin" would surprisingly extend it to "sinh(".
      matches.sort(function (a, b) { return a.length - b.length || (a < b ? -1 : a > b ? 1 : 0); });
      return matches;
    }
    // Pure bookkeeping only (no DOM touched) — called from the keydown
    // handler below, before MathQuill has actually applied the keystroke,
    // so there's nothing reliable to render/position against yet. The
    // actual dropdown render/reposition happens from completionOnFieldEdited()
    // instead, which is the "edit" handler every math/graph/matrix-cell
    // field already calls on every edit, live or programmatic — guaranteed
    // to fire AFTER MathQuill has updated its DOM (including moving the
    // real .mq-cursor element), unlike this keydown handler itself.
    function updateCompletionBuffer(field, buffer) {
      completion.field = field;
      completion.buffer = buffer;
      completion.matches = completionMatchesFor(buffer);
      completion.highlight = 0;
    }
    // Finds the field's own live cursor element to anchor the dropdown
    // against. Confirmed empirically (not assumed) that ".mq-cursor" is a
    // real, single DOM element with a normal getBoundingClientRect() for
    // every MathQuill field shape this app creates (math-line, graph-line
    // expression field, matrix-cell) — they're all built from the same
    // MQ.MathField constructor, just given different container elements,
    // and a throwaway headless-Chromium check (this file's own established
    // way of confirming a MathQuill claim rather than assuming it) typing
    // partial text into a MathField found exactly one ".mq-cursor" node
    // with sane left/top/bottom/width/height every time. Falls back to the
    // field's own root element (field.el() — confirmed to return the exact
    // container passed to MQ.MathField/addCellToRow/convertToGraph) if for
    // some reason no cursor element is found (e.g. the field lost focus
    // between the keystroke and this call).
    function positionCompletionDropdown(dropdownEl, field) {
      var cursorEl = field.el().querySelector(".mq-cursor");
      var rect = (cursorEl || field.el()).getBoundingClientRect();
      dropdownEl.style.left = rect.left + "px";
      dropdownEl.style.top = (rect.bottom + 4) + "px";
    }
    // (Re)builds the dropdown's rows from `completion.matches`/`highlight`
    // and repositions it against the field's current cursor position.
    // Called both after a real field edit (completionOnFieldEdited) and
    // directly after Up/Down changes the highlight (no field edit happens
    // for that, so nothing else would trigger a re-render).
    function renderCompletionDropdown() {
      var el = completion.dropdownEl;
      if (!el) {
        el = document.createElement("div");
        el.className = "completion-dropdown";
        document.body.appendChild(el);
        completion.dropdownEl = el;
      }
      el.innerHTML = "";
      completion.matches.forEach(function (name, i) {
        var item = document.createElement("div");
        item.className = "completion-item" + (i === completion.highlight ? " completion-active" : "");
        item.textContent = name;
        el.appendChild(item);
      });
      positionCompletionDropdown(el, completion.field);
    }
    // Called from every math/graph/matrix-cell field's "edit" handler
    // (added right alongside each one's existing edit-handling, below) —
    // the one correct place to actually show/hide/reposition the dropdown,
    // since by the time "edit" fires MathQuill has already applied the
    // keystroke and moved its real cursor element. A no-op for an edit on
    // any field other than the one currently being tracked (including
    // "no field at all", i.e. completion.field is null) — covers both an
    // edit caused by something this feature doesn't care about (a matrix
    // result being cleared, a graph re-rendering, ...) and the edits
    // acceptCompletion() itself causes while finishing a word, which it
    // deliberately resets tracking before making, for exactly this reason.
    function completionOnFieldEdited(field) {
      if (completion.field !== field) return;
      if (completion.matches.length === 0) { hideCompletionDropdown(); return; }
      renderCompletionDropdown();
    }
    // Finishes typing the highlighted match's remaining literal characters
    // (whatever's left after what's already been typed) plus a following
    // "(" — via the field's own typedText(), the exact same mechanism
    // insertChar()/the Greek-letter handler already use elsewhere in this
    // file, not a new insertion path. MathQuill's own auto-bracket-pairing
    // then takes over for the "(" exactly as if the user had typed it
    // (confirmed empirically: typedText("t(") after typing "de" produces
    // "\det\left(\right)", the same as typing "det(" by hand). Resets
    // tracking FIRST, before typedText() runs — typedText() can fire
    // several of this field's own "edit" events while it inserts each
    // character, and completionOnFieldEdited() would otherwise see the
    // still-stale (pre-acceptance) matches/highlight mid-insertion.
    function acceptCompletion() {
      var field = completion.field;
      var name = completion.matches[completion.highlight];
      var remaining = name.slice(completion.buffer.length);
      resetCompletion();
      field.typedText(remaining + "(");
    }
    // Closes the dropdown (without inserting anything) the moment focus
    // moves to any element outside the field currently being tracked —
    // covers clicking/Tabbing/arrowing to a different line or cell, and is
    // the mechanism behind "closes naturally ... on focus loss" from
    // TODO.md's interaction spec. "focusin" (rather than "blur"/
    // "focusout") is used specifically because it always fires on the
    // newly-focused element regardless of how MathQuill implements a
    // field's own focus handling internally (a hidden textarea under the
    // hood, confirmed empirically above) — so this doesn't depend on
    // guessing which element inside MathQuill's structure "blur" would
    // even fire on.
    document.addEventListener("focusin", function (e) {
      if (completion.field && !completion.field.el().contains(e.target)) resetCompletion();
    }, true);

    // One global capture-phase listener handles every "this key means
    // something special" case in the app: Ctrl+S/Ctrl+Q (routed to Qt),
    // Ctrl+L (toggles paper mode, handled entirely here), Ctrl+<letter>/
    // Ctrl+Shift+<letter> (Greek-letter insertion, GREEK_LOWER/GREEK_UPPER
    // above), and, depending on what's focused, either matrix-cell keys
    // ("," ";" Tab arrows) or math-line keys (":" "\" "|" "="). Capture
    // phase means it sees the keystroke before MathQuill's own per-field
    // handling does, which is what lets it override MathQuill's defaults
    // for keys like ":" and "\" instead of just supplementing them.
    document.addEventListener("keydown", function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (mod && !e.shiftKey && !e.altKey) {
        if (e.key === "s" || e.key === "S") {
          e.preventDefault(); e.stopImmediatePropagation();
          window.location.href = "livesheet:export";
          return;
        }
        if (e.key === "q" || e.key === "Q") {
          e.preventDefault(); e.stopImmediatePropagation();
          window.location.href = "livesheet:quit";
          return;
        }
        if (e.key === "l" || e.key === "L") {
          e.preventDefault(); e.stopImmediatePropagation();
          togglePaperMode();
          return;
        }
      }

      // --- Greek letters: Ctrl+<letter> / Ctrl+Shift+<letter> ---------
      // Checked here, narrowly, before the generic "let every other Ctrl
      // combo through" rule just below: only a key actually present in
      // GREEK_LOWER/GREEK_UPPER is matched at all. Every unmapped combo —
      // a/c/v/x (clipboard), plain s/q/l (handled above already), and
      // every key that was never given a mapping — isn't matched by the
      // lookup below, so this block does nothing for it and execution
      // falls through, exactly as if this block weren't here, to that
      // same "let every other Ctrl combo through" rule. A *mapped* key
      // with nothing MathQuill-shaped focused (e.g. a heading) also isn't
      // intercepted — only preventDefault()/stopImmediatePropagation() are
      // skipped in that case, not the early return, but the observable
      // effect (event left alone for the browser's own default handling)
      // is the same either way.
      if (mod && !e.altKey) {
        var greekCmd = (e.shiftKey ? GREEK_UPPER : GREEK_LOWER)[e.key.toLowerCase()];
        if (greekCmd) {
          var greekField = resolveMathField(e.target);
          if (greekField) {
            e.preventDefault(); e.stopImmediatePropagation();
            greekField.cmd(greekCmd);
            return;
          }
          // No MathQuill field to resolve to yet — if this is the very
          // first keystroke on a brand-new pending line, there's no
          // field *because* nothing has converted it to one yet. Unlike
          // a plain-character shortcut ("\", ";", "$", "#", "@", a
          // heading marker), which reaches wirePendingInput() for free
          // because the browser inserts the literal character into the
          // contenteditable first (firing the "input" event that path
          // depends on), holding Ctrl suppresses that normal text
          // insertion entirely: no character lands, no "input" event
          // fires, so wirePendingInput() never sees anything to convert.
          // Convert the line to math proactively right here — the same
          // thing wirePendingInput()'s own "[", "@", and heading checks
          // do — then insert the Greek command into the field that
          // conversion just created, rather than relying on a replay
          // path this modifier-key combo can never feed.
          var pendingEl = e.target.closest ? e.target.closest(".pending") : null;
          var pendingLine = pendingEl && pendingEl._line;
          if (pendingLine && pendingLine.type === "pending") {
            e.preventDefault(); e.stopImmediatePropagation();
            convertToMath(pendingLine, "");
            pendingLine.mathField.cmd(greekCmd);
          }
          return;
        }
      }

      // --- Symbolic integral trigger: Ctrl+Shift+I ---------------------
      // Inserts a bare "\int" symbol followed by an auto-paired "(" (see
      // matchIntegralTrigger()'s own comment above for why the paren is
      // required, not cosmetic). Mathcad's OWN keyboard convention for
      // the integral operator is Ctrl+I in its legacy versions (definite
      // integral there is a separate "&" shortcut) and Ctrl+Shift+I in
      // its later Prime-era versions (PTC's own docs, web-searched) —
      // Ctrl+I here is already taken (GREEK_LOWER's "i" -> "\iota", see
      // above), so Ctrl+Shift+I is used instead: it's free (GREEK_UPPER
      // has no "i" entry) AND is Mathcad's own later-version convention
      // for this exact operator, not an arbitrary pick. Always
      // preventDefault()/stopImmediatePropagation() when handled, same
      // as Ctrl+S/Ctrl+Q above overriding their own browser defaults —
      // Ctrl+Shift+I is Chromium's own "open DevTools" shortcut, which
      // would otherwise fire inside this QtWebEngineView.
      if (mod && e.shiftKey && !e.altKey && (e.key === "i" || e.key === "I")) {
        var intField = resolveMathField(e.target);
        if (intField) {
          e.preventDefault(); e.stopImmediatePropagation();
          intField.cmd("\\int");
          intField.typedText("(");
          return;
        }
        // Same "fresh pending line has no field yet" gap the Greek-letter
        // handler above already works around — see its own comment for
        // why a Ctrl-modified key reaches here with no field to resolve
        // to on a brand-new line, and why converting the line to math
        // right here (rather than relying on wirePendingInput()'s
        // buffered-replay path) is the fix.
        var intPendingEl = e.target.closest ? e.target.closest(".pending") : null;
        var intPendingLine = intPendingEl && intPendingEl._line;
        if (intPendingLine && intPendingLine.type === "pending") {
          e.preventDefault(); e.stopImmediatePropagation();
          convertToMath(intPendingLine, "");
          intPendingLine.mathField.cmd("\\int");
          intPendingLine.mathField.typedText("(");
        }
        return;
      }

      // --- Program-block structural inserts: Ctrl+Shift+R/W/N/B/T/E ----
      // TODO.md's "program blocks" item: for/while/if/break/continue/
      // return each need their own insertion keystroke, since none of
      // them is a character a user would type into a field otherwise
      // (see this feature's own header comment, by buildProgramContainer()
      // above, for why they're rendered as static labels rather than
      // typed text at all). Mathcad itself has no bare-key convention
      // for any of these — its real Programming toolbar inserts them by
      // click (PTC's own docs, web-searched the same way every other
      // Mathcad-keybinding claim in this file was) — so this app picks
      // its own six letters, chosen only from the ones confirmed free of
      // every existing Ctrl/Ctrl+Shift binding (not a single bare
      // Ctrl+<letter> was free — GREEK_LOWER plus this app's own s/q/l
      // claims every one of the 26 — so these are all Ctrl+SHIFT+<letter>,
      // checked against GREEK_UPPER instead, which leaves b/e/h/k/m/n/p/
      // r/t/w free):
      //   R — for   (mnemonic: a for-loop here iterates a Range/
      //              collection value; "F" itself is GREEK_UPPER's Phi)
      //   W — while (exact mnemonic, free either way)
      //   N — if    ("I" is already the integral trigger above, so N
      //              stands in — no real mnemonic, just one of the few
      //              free letters left)
      //   B — break (exact mnemonic, free)
      //   T — continue ("C" is left for copy/paste; T from "conTinue")
      //   E — return    ("R" is taken by for above; E from "rEturn")
      if (mod && e.shiftKey && !e.altKey && /^[rwnbte]$/i.test(e.key)) {
        // Unconditional preventDefault/stopImmediatePropagation here,
        // NOT gated on pfIns resolving (unlike the Greek-letter/integral
        // patterns above, which deliberately let the browser default
        // through when nothing MathQuill-shaped is focused — see their
        // own comments). "R" specifically collides with Chromium's own
        // hard-reload shortcut, and this app has no save/persistence at
        // all (session-only) — letting that through when the user isn't
        // actually focused in a program field (e.g. a stray keystroke
        // while editing an ordinary line) would silently wipe the whole
        // notebook, a categorically worse outcome than the benign "open
        // DevTools"/cosmetic defaults the other patterns accept leaving
        // unguarded. Applied to all six letters here for consistency,
        // not just "r" — there's no upside to preserving any of their
        // browser defaults while a program field exists on the sheet.
        e.preventDefault(); e.stopImmediatePropagation();
        var pfIns = resolveProgramField(e.target);
        if (pfIns) {
          switch (e.key.toLowerCase()) {
            case "r": insertStructural(pfIns.progLine, pfIns.stmt, "for"); break;
            case "w": insertStructural(pfIns.progLine, pfIns.stmt, "while"); break;
            case "n": insertStructural(pfIns.progLine, pfIns.stmt, "if"); break;
            case "b": insertKeywordStatement(pfIns.progLine, pfIns.stmt, "break"); break;
            case "t": insertKeywordStatement(pfIns.progLine, pfIns.stmt, "continue"); break;
            case "e": insertKeywordStatement(pfIns.progLine, pfIns.stmt, "return"); break;
          }
        }
        return;
      }

      // Nothing below this point wants to intercept a Ctrl/Cmd combo
      // (copy, paste, select-all, ...), so let those all through as-is.
      if (mod) return;

      // --- Inline code-completion keys ---------------------------------
      // resolveMathField() already unifies math-line/graph-line/matrix-
      // cell into "the one field this keystroke is going into", the same
      // resolution the Greek-letter handler above uses — completion reuses
      // it rather than re-deriving which of the three shapes this is.
      var completionField = resolveMathField(e.target);
      if (completionField) {
        // Highest priority, ahead of EVERY other meaning these same keys
        // have below (Tab for matrix-cell navigation, Enter for a new
        // line, arrows for cell/line movement): once the dropdown is
        // actually showing for this exact field, Up/Down/Enter/Tab/Escape
        // unambiguously mean "drive the dropdown", not "do the field's
        // normal thing" — deliberately overriding those other meanings for
        // this one keystroke only, same as how a matrix cell already
        // overrides MathQuill's own default meaning for "," and ";".
        if (completion.field === completionField && completion.matches.length > 0) {
          if (e.key === "ArrowDown") {
            e.preventDefault(); e.stopImmediatePropagation();
            completion.highlight = (completion.highlight + 1) % completion.matches.length;
            renderCompletionDropdown();
            return;
          }
          if (e.key === "ArrowUp") {
            e.preventDefault(); e.stopImmediatePropagation();
            completion.highlight = (completion.highlight - 1 + completion.matches.length) % completion.matches.length;
            renderCompletionDropdown();
            return;
          }
          if (e.key === "Enter" || e.key === "Tab") {
            e.preventDefault(); e.stopImmediatePropagation();
            acceptCompletion();
            return;
          }
          if (e.key === "Escape") {
            // Dismiss without inserting anything, leaving the typed text
            // exactly as it is — just stop tracking/hide the dropdown.
            e.preventDefault(); e.stopImmediatePropagation();
            resetCompletion();
            return;
          }
        }
        // Otherwise: track the contiguous run of letters just typed,
        // immediately before the cursor, as a plain string — NOT by
        // reading it back out of the field's own LaTeX/DOM afterward.
        // Confirmed empirically (see BUILTIN_FUNCTION_NAMES' comment
        // above) that a multi-letter name MathQuill doesn't already
        // recognize (anything in WRAPPED_BUILTINS, or trace/solve/mean/
        // median/variance/stdev) renders as several SEPARATE adjacent
        // single-letter variable nodes, never grouped into one token, so
        // there's no single place to read "the current word" back from —
        // tracking what was actually typed, in order, as it's typed, is
        // both simpler and exactly what's needed anyway (the literal
        // characters still left to type). Letters are never
        // preventDefault()'d here — this only ever OBSERVES typing, same
        // as it never changes what a plain letter keystroke does; backspace
        // likewise is only tracked, not intercepted, so it still deletes
        // normally too.
        if (/^[a-z]$/.test(e.key)) {
          var base = completion.field === completionField ? completion.buffer : "";
          updateCompletionBuffer(completionField, base + e.key);
        } else if (e.key === "Backspace") {
          if (completion.field === completionField && completion.buffer.length > 0) {
            updateCompletionBuffer(completionField, completion.buffer.slice(0, -1));
          }
        } else if (completion.field === completionField) {
          // Any other key breaks the contiguous run (a digit, an operator,
          // an arrow key moving the cursor elsewhere, Space, an Enter/Tab/
          // Escape that reached here only because the dropdown wasn't
          // open, ...) — stop tracking entirely rather than leaving a
          // stale buffer that no longer reflects what's actually to the
          // left of the cursor.
          resetCompletion();
        }
      }

      // --- Program-block statement-field keys --------------------------
      // TODO.md's "program blocks" item. Enter is DELIBERATELY not
      // intercepted here — onProgramEnter() is already wired as this
      // field's own MathQuill "enter" handler (createProgramField()
      // above), the exact same mechanism every math-line/matrix-cell
      // field's own Enter already relies on (see onEnter()'s/
      // addCellToRow()'s own handlers.enter) instead of the document
      // listener duplicating it — letting the keystroke fall through
      // un-intercepted here is what lets MathQuill's own internal
      // key-handling reach that configured handler at all. Tab DOES need
      // handling here, unlike Enter: MathQuill has no configurable "Tab"
      // option the way it does enter/deleteOutOf/moveOutOf (matrix cells
      // already intercept Tab at this same document level for the exact
      // same reason — see the "Matrix-cell keys" block below). Reuses
      // the flat reading-order model (programFieldList()) this feature's
      // own header comment describes. ":" is the program-scoped equivalent
      // of the SAME physical key already meaning worksheet-level ":="
      // on an ordinary math line (insertChar()) — Mathcad itself uses a
      // genuinely different symbol (←, not :=) for local assignment
      // inside a program, which is exactly what this reuses the key for
      // instead of inventing a new one. ";"/"\\"/"|"/"$"/"#" go through
      // insertChar() exactly like an ordinary math line (sqrt, nth root,
      // range, Σ, Π all make just as much sense inside a program
      // statement's own expression). "=" is the bare-program evaluate
      // trigger (§10 of the spec) ONLY for the program's own last
      // top-level statement when it isn't a function body — everywhere
      // else (a header field, a nested body row, a function-body
      // program) it's deliberately left un-intercepted so MathQuill
      // types it literally, the same default a graph line's own
      // expression field already relies on for the identical reason
      // (see insertChar()'s own "=" branch and its `hostLine.type !==
      // "graph"` guard) — which is exactly the equality-comparison
      // behavior an if/while condition field needs.
      var pf = resolveProgramField(e.target);
      if (pf) {
        if (e.key === "Tab") {
          e.preventDefault(); e.stopImmediatePropagation();
          onProgramMoveOutOf(pf.progLine, pf.stmt, pf.role, e.shiftKey ? MQ.L : MQ.R);
          return;
        }
        if (e.key === ":" && pf.stmt.kind === "assign" && pf.role === "expr") {
          e.preventDefault(); e.stopImmediatePropagation();
          pf.field.cmd("\\leftarrow");
          return;
        }
        if (e.key === ";" || e.key === "\\" || e.key === "|" || e.key === "$" || e.key === "#") {
          e.preventDefault(); e.stopImmediatePropagation();
          insertChar({ mathField: pf.field }, e.key);
          return;
        }
        if (e.key === "=") {
          var topStmts = pf.progLine.statements;
          var isLastTopLevel = pf.role === "expr" && topStmts.length > 0 &&
            topStmts[topStmts.length - 1] === pf.stmt;
          if (isLastTopLevel && !pf.progLine.fnName) {
            e.preventDefault(); e.stopImmediatePropagation();
            var capturedLatex = pf.field.latex();
            pf.field.moveToRightEnd();
            pf.field.typedText("=");
            evaluateProgramAndAppend(pf.progLine, pf.field, pf.stmt, capturedLatex);
          }
          return;
        }
        return;
      }

      // --- Matrix-cell keys -------------------------------------------
      var cellEl = e.target.closest ? e.target.closest(".matrix-cell") : null;
      if (cellEl && cellEl._line) {
        var mLine = cellEl._line, r = cellEl._row, c = cellEl._col;
        if (e.key === ",") {
          // Adds a new column to the current row and moves into it.
          e.preventDefault(); e.stopImmediatePropagation();
          addCellToRow(mLine, r).focus();
          return;
        }
        if (e.key === ";") {
          // Starts a new row (with one empty cell) and moves into it.
          e.preventDefault(); e.stopImmediatePropagation();
          addCellToRow(mLine, addRow(mLine)).focus();
          return;
        }
        if (e.key === "Tab") {
          // Tab/Shift+Tab walk the cells in reading order (left to right,
          // then down a row), stepping out to the notebook line before/
          // after the matrix once there's no next/previous cell left.
          e.preventDefault(); e.stopImmediatePropagation();
          if (!e.shiftKey) {
            if (c < mLine.rows[r].length - 1) focusCell(mLine, r, c + 1);
            else if (r < mLine.rows.length - 1) focusCell(mLine, r + 1, 0);
            else exitMatrixForward(mLine);
          } else {
            if (c > 0) focusCell(mLine, r, c - 1);
            else if (r > 0) focusCell(mLine, r - 1, mLine.rows[r - 1].length - 1);
            else exitMatrixBackward(mLine);
          }
          return;
        }
        if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          // Always moves a row (rather than letting MathQuill navigate a
          // fraction's blocks vertically within the cell); matrix row
          // navigation takes priority here. At the top/bottom row, it
          // steps out to the adjacent notebook line.
          e.preventDefault(); e.stopImmediatePropagation();
          var down = e.key === "ArrowDown";
          var targetRow = r + (down ? 1 : -1);
          if (mLine.rows[targetRow]) {
            focusCell(mLine, targetRow, Math.min(c, mLine.rows[targetRow].length - 1));
          } else if (down) {
            exitMatrixForward(mLine);
          } else {
            exitMatrixBackward(mLine);
          }
          return;
        }
        return;
      }

      // A graph's own expression field gets the same construct shortcuts
      // (sqrt, nth root, ranges, sum/product...) as a regular math line,
      // but not "=" — there's no single result to evaluate-and-append to,
      // the whole line already continuously re-evaluates itself per
      // sample (see renderGraph()) as you type.
      var hostLineEl = e.target.closest ? e.target.closest(".math-line, .graph-line") : null;
      var hostLine = hostLineEl && hostLineEl._line;
      if (!hostLine) return;

      // "A:[" names a matrix, the same spirit as "A:3" already becoming
      // "A := 3" (see insertChar()'s ":" handling): only when the field
      // shows EXACTLY an identifier followed by ":=" so far — nothing
      // else typed yet — does "[" convert the whole line into a named
      // matrix instead of being typed literally. Anything else (a bare
      // "[" with no name in progress, "[" in the middle of some other
      // expression, ...) falls through to MathQuill's own default "["
      // handling (auto-matched bracket pair), completely unaffected.
      if (e.key === "[" && hostLine.type === "math") {
        var lhsSoFar = parseDefinitionLHS(hostLine.mathField.latex());
        if (lhsSoFar && lhsSoFar.rest === ":=") {
          e.preventDefault(); e.stopImmediatePropagation();
          convertMathToMatrix(hostLine, lhsSoFar.name);
          return;
        }
      }

      // "f(x):={" turns a function-signature-so-far math line into a
      // program block that's that function's own body (§1/§8 of the
      // program-blocks spec) — the exact same shape of check as "[" just
      // above for a named matrix, just matching a full "name(params):="
      // signature (matchFunctionSignatureSoFar()) instead of a bare
      // "name:=". Anything else ("{" with no signature typed yet, "{" in
      // the middle of some other expression, ...) falls through to
      // MathQuill's own default "{" handling, completely unaffected —
      // same as "[" above.
      if (e.key === "{" && hostLine.type === "math") {
        var sig = matchFunctionSignatureSoFar(hostLine.mathField.latex());
        if (sig) {
          e.preventDefault(); e.stopImmediatePropagation();
          convertMathToProgram(hostLine, sig.name, sig.params);
          return;
        }
      }

      // These keys have their own meaning to MathQuill (":" and "=" are
      // unbound, "\" opens its LaTeX-command-name entry mode, ";" would
      // otherwise just type a literal semicolon, "$"/"#" would otherwise
      // just type those literal characters) that we override here, via
      // the same insertChar() used for buffered replay.
      if (e.key === ":" || e.key === ";" || e.key === "\\" || e.key === "|" || e.key === "$" || e.key === "#" ||
          (e.key === "=" && hostLine.type !== "graph")) {
        e.preventDefault(); e.stopImmediatePropagation();
        insertChar(hostLine, e.key);
      }
    }, true);

    // The page starts life as a single empty pending line, focused and
    // ready to type into.
    focusLine(createPendingLine());

    // Called from Qt (Main.qml's export dialog, via
    // runJavaScript("JSON.stringify(collectDocument())")) to gather the
    // whole document for export: an ordered list of {type, content}
    // objects, one per line, with content already turned into LaTeX for
    // both math and matrix lines (Backend::blocksToLatex on the C++ side
    // only has to know about a generic "math" block, not matrices
    // specifically). A matrix line's own "matrix" type is a notebook.html
    // concept only — Qt only ever sees it already flattened to LaTeX.
    function collectDocument() {
      return lines.map(function (line) {
        if (line.type === "math") return { type: "math", content: line.mathField.latex() };
        if (line.type === "matrix") return { type: "math", content: matrixLatex(line) };
        // A program block degrades to readable \text{...}-labelled LaTeX
        // — see programExportLatex()'s own comment for why (no real
        // LaTeX program-block environment to target, same situation a
        // graph's own export comment below describes).
        if (line.type === "program") return { type: "math", content: programExportLatex(line) };
        // A graph has no plotted-image equivalent in the exported LaTeX —
        // that would need an actual plotting package (pgfplots or
        // similar) driven from sampled data, well beyond this app's
        // scope — so it degrades to just the defining equation, "y = "
        // (or, for a 3D surface, "z = ") plus whatever was typed, as a
        // normal display equation. line.graphMode is set by renderGraph()
        // the same way the on-screen label is, so this follows whichever
        // mode was last detected rather than assuming 2D.
        if (line.type === "graph") {
          return { type: "math", content: (line.graphMode === "3d" ? "z=" : "y=") + line.mathField.latex() };
        }
        if (line.type === "heading-1") return { type: "title", content: line.el.textContent };
        if (line.type === "heading-2") return { type: "paragraph", content: line.el.textContent };
        if (line.type === "heading-3") return { type: "subparagraph", content: line.el.textContent };
        return { type: "text", content: line.el.textContent };
      });
    }
  </script>
</body>
</html>
