        if (src.startsWith("\\sqrt", pos) || src.startsWith("\\frac", pos) || src.startsWith("\\left(", pos)) return true;
        if (matchIdentifierAt(src, pos) !== null) return true;
        for (var k in DERIV_FUNC_NAMES) if (src.startsWith(k, pos)) return true;
        return false;
      }
      function parseExprT() {
        var v = parseTermT();
        for (;;) {
          if (eat("+")) v = addNode(v, parseTermT());
          else if (eat("-")) v = subNode(v, parseTermT());
          else break;
        }
        return v;
      }
      function parseTermT() {
        var v = parsePowT();
        for (;;) {
          if (eat("\\cdot") || eat("\\times") || eat("*")) v = mulNode(v, parsePowT());
          else if (eat("\\div")) v = divNode(v, parsePowT());
          else if (atomAheadT()) v = mulNode(v, parsePowT());
          else break;
        }
        return v;
      }
      function parsePowT() {
        var v = parseUnaryT();
        if (eat("^")) {
          skipWs();
          var exp = peek() === "{" ? parseGroupT() : parseUnaryT();
          v = powNode(v, exp);
        }
        return v;
      }
      function parseUnaryT() {
        if (eat("-")) return negNode(parseUnaryT());
        if (eat("+")) return parseUnaryT();
        return parseAtomT();
      }
      function parseCallArgT() {
        var usesLeft = eat("\\left(");
        if (!usesLeft && !eat("(")) throw new Error("expected ( after function name");
        var arg = parseExprT();
        if (usesLeft) eat("\\right)"); else eat(")");
        return arg;
      }
      function parseAtomT() {
        skipWs();
        if (eat("\\sqrt")) {
          var idx = parseBracketGroupT();
          var radicand = parseGroupT();
          return powNode(radicand, idx !== null ? divNode(numNode(1), idx) : numNode(0.5));
        }
        if (eat("\\frac")) {
          var num = parseGroupT();
          var den = parseGroupT();
          return divNode(num, den);
        }
        if (eat("\\left(")) { var v = parseExprT(); eat("\\right)"); return v; }
        if (eat("(")) { var v2 = parseExprT(); eat(")"); return v2; }
        var m = /^[0-9]+(\.[0-9]+)?/.exec(src.slice(pos));
        if (m) { pos += m[0].length; return numNode(parseFloat(m[0])); }
        for (var cmd in DERIV_FUNC_NAMES) {
          if (eat(cmd)) return callNode(DERIV_FUNC_NAMES[cmd], parseCallArgT());
        }
        var ident = matchIdentifierAt(src, pos);
        if (ident !== null) { pos += ident.length; return varNode(ident); }
        throw new Error("unexpected token at " + pos + " in " + src);
      }
      var result = parseExprT();
      skipWs();
      if (pos < src.length) throw new Error("trailing input in derivative expression");
      return result;
    }

    // Does `node`'s subtree reference the variable `v` anywhere? Used by
    // differentiate()'s "pow" case to decide which rule applies —
    // "constant with respect to v" means "v doesn't occur in it
    // anywhere", not "it's literally a number": another variable (or an
    // expression built only from other variables/numbers) is just as
    // constant for this differentiation as a literal.
    function containsVar(node, v) {
      switch (node.type) {
        case "num": return false;
        case "var": return node.name === v;
        case "neg": return containsVar(node.arg, v);
        case "call": return containsVar(node.arg, v);
        case "add": case "sub": case "mul": case "div":
          return containsVar(node.left, v) || containsVar(node.right, v);
        case "pow": return containsVar(node.base, v) || containsVar(node.exp, v);
      }
      return false;
    }

    // The actual differentiation rules — TODO.md's agreed v1 scope:
    // constants -> 0, the diff variable itself -> 1, any other variable
    // -> 0, sum/difference linearity, product rule, quotient rule, the
    // power rule for a constant exponent, sin/cos/tan, exp/e^f and ln/log
    // (both via the chain rule, which falls out automatically here from
    // "multiply by the inner derivative" at every rule, rather than
    // needing separate handling). Returns a brand-new tree, never
    // mutates `node`.
    function differentiate(node, v) {
      switch (node.type) {
        case "num": return numNode(0);
        case "var": return numNode(node.name === v ? 1 : 0);
        case "neg": return negNode(differentiate(node.arg, v));
        case "add": return addNode(differentiate(node.left, v), differentiate(node.right, v));
        case "sub": return subNode(differentiate(node.left, v), differentiate(node.right, v));
        case "mul":
          return addNode(
            mulNode(differentiate(node.left, v), node.right),
            mulNode(node.left, differentiate(node.right, v))
          );
        case "div":
          return divNode(
            subNode(mulNode(differentiate(node.left, v), node.right), mulNode(node.left, differentiate(node.right, v))),
            powNode(node.right, numNode(2))
          );
        case "pow": {
          var baseHasV = containsVar(node.base, v), expHasV = containsVar(node.exp, v);
          if (!baseHasV && !expHasV) return numNode(0);
          if (expHasV && !baseHasV) {
            // Exponential rule: d/dx(b^f) = b^f * ln(b) * f' — covers
            // exp(f)/e^f the same way as any other constant base. Note:
            // "e" is just an ordinary var node to this layer (not a
            // recognized constant), so ln(e) does NOT simplify away in
            // simplifyTree() below — d/dx(e^{3x}) renders as the
            // mathematically-correct but unreduced e^{3x}\cdot\ln(e)\cdot3,
            // confirmed live, not a bug.
            return mulNode(mulNode(node, callNode("ln", node.base)), differentiate(node.exp, v));
          }
          if (baseHasV && !expHasV) {
            // Power rule: d/dx(f^n) = n * f^(n-1) * f'
            return mulNode(mulNode(node.exp, powNode(node.base, subNode(node.exp, numNode(1)))), differentiate(node.base, v));
          }
          throw new Error("differentiation: a variable base raised to a variable exponent (f(x)^g(x)) is not supported");
        }
        case "call": {
          var f = node.arg, fp = differentiate(f, v);
          switch (node.name) {
            case "sin": return mulNode(callNode("cos", f), fp);
            case "cos": return negNode(mulNode(callNode("sin", f), fp));
            case "tan": return divNode(fp, powNode(callNode("cos", f), numNode(2)));
            case "exp": return mulNode(callNode("exp", f), fp);
            case "ln": return divNode(fp, f);
            case "log": return divNode(fp, mulNode(f, callNode("ln", numNode(10))));
            default: throw new Error("differentiation: don't know how to differentiate " + node.name);
          }
        }
      }
      throw new Error("differentiation: unsupported expression form");
    }

    // A deliberately small identity-cleanup pass — NOT a general
    // simplifier (TODO.md explicitly scopes this out): folds +0/-0/*0/
    // *1//1/^0/^1, double negation, constant-constant arithmetic for
    // +/-/*, and turns add(a, neg(b))/sub(a, neg(b)) into the more
    // readable sub(a,b)/add(a,b). Runs bottom-up (children simplified
    // before the parent is inspected) so a fold that only becomes
    // possible after a child folds (e.g. "x*1 + 0") is caught by this
    // same single recursive pass, no fixed-point loop needed.
    function simplifyTree(node) {
      if (node.type === "num" || node.type === "var") return node;
      if (node.type === "neg") {
        var a = simplifyTree(node.arg);
        if (a.type === "num") return numNode(-a.value);
        if (a.type === "neg") return a.arg;
        return negNode(a);
      }
      if (node.type === "call") return callNode(node.name, simplifyTree(node.arg));
      if (node.type === "pow") {
        var base = simplifyTree(node.base), exp = simplifyTree(node.exp);
        if (exp.type === "num" && exp.value === 0) return numNode(1);
        if (exp.type === "num" && exp.value === 1) return base;
        if (base.type === "num" && base.value === 1) return numNode(1);
        if (base.type === "num" && exp.type === "num") return numNode(Math.pow(base.value, exp.value));
        return powNode(base, exp);
      }
      var l = simplifyTree(node.left), r = simplifyTree(node.right);
      if (node.type === "add") {
        if (r.type === "neg") return simplifyTree(subNode(l, r.arg));
        if (l.type === "num" && l.value === 0) return r;
        if (r.type === "num" && r.value === 0) return l;
        if (l.type === "num" && r.type === "num") return numNode(l.value + r.value);
        return addNode(l, r);
      }
      if (node.type === "sub") {
        if (r.type === "neg") return simplifyTree(addNode(l, r.arg));
        if (r.type === "num" && r.value === 0) return l;
        if (l.type === "num" && l.value === 0) return simplifyTree(negNode(r));
        if (l.type === "num" && r.type === "num") return numNode(l.value - r.value);
        return subNode(l, r);
      }
      if (node.type === "mul") {
        if ((l.type === "num" && l.value === 0) || (r.type === "num" && r.value === 0)) return numNode(0);
        if (l.type === "num" && l.value === 1) return r;
        if (r.type === "num" && r.value === 1) return l;
        if (l.type === "num" && l.value === -1) return simplifyTree(negNode(r));
        if (r.type === "num" && r.value === -1) return simplifyTree(negNode(l));
        if (l.type === "num" && r.type === "num") return numNode(l.value * r.value);
        return mulNode(l, r);
      }
      if (node.type === "div") {
        if (l.type === "num" && l.value === 0) return numNode(0);
        if (r.type === "num" && r.value === 1) return l;
        return divNode(l, r);
      }
      return node;
    }

    // Precedence used only to decide where a \left(\right) wrap is
    // needed when rendering back to LaTeX (treeToLatex() below) — 4 =
    // atom-like (num/var/call/pow, never need wrapping as an operand),
    // 3 = * /, 2 = unary -, 1 = + -.
    function treeLatexPrec(node) {
      switch (node.type) {
        case "num": case "var": case "call": case "pow": return 4;
        case "mul": case "div": return 3;
        case "neg": return 2;
        case "add": case "sub": return 1;
      }
      return 4;
    }
    function wrapParen(latex) { return "\\left(" + latex + "\\right)"; }
    // Renders a tree back into LaTeX for display — the "formula result"
    // counterpart of formatNumber() above, for a result that's an
    // expression rather than a plain value. \frac{}{} is used for
    // division (its own bar already groups both sides, no extra parens
    // needed) and explicit \cdot for multiplication (rather than bare
    // juxtaposition) so a complex generated expression never reads
    // ambiguously.
    function treeToLatex(node) {
      switch (node.type) {
        case "num": return formatNumber(node.value);
        case "var": return node.name;
        case "neg": {
          var a = treeToLatex(node.arg);
          return "-" + (treeLatexPrec(node.arg) < 2 ? wrapParen(a) : a);
        }
        case "call": return "\\" + node.name + wrapParen(treeToLatex(node.arg));
        case "pow": {
          var b = treeToLatex(node.base);
          var baseAtom = node.base.type === "num" || node.base.type === "var" || node.base.type === "call";
          return (baseAtom ? b : wrapParen(b)) + "^{" + treeToLatex(node.exp) + "}";
        }
        case "div": return "\\frac{" + treeToLatex(node.left) + "}{" + treeToLatex(node.right) + "}";
        case "mul": {
          var l = treeToLatex(node.left), r = treeToLatex(node.right);
          if (treeLatexPrec(node.left) < 2) l = wrapParen(l);
          if (treeLatexPrec(node.right) < 2) r = wrapParen(r);
          return l + " \\cdot " + r;
        }
        case "add": return treeToLatex(node.left) + " + " + treeToLatex(node.right);
        case "sub": {
          var rr = treeToLatex(node.right);
          if (treeLatexPrec(node.right) <= 1) rr = wrapParen(rr);
          return treeToLatex(node.left) + " - " + rr;
        }
      }
      throw new Error("cannot render node type " + node.type);
    }

    // --- Symbolic indefinite integration (phase 2) ----------------------
    //
    // Reuses every piece of phase 1's AST layer above completely as-is
    // (node shapes, parseLatexToTree(), containsVar(), simplifyTree(),
    // treeToLatex(), appendFormulaResult() below) — this is purely new
    // functions added on top, same "brand-new additive layer" posture as
    // phase 1 itself. Integration is NOT differentiate() run backwards:
    // it needs real technique selection (which rule even applies to a
    // given integrand), so this is its own small engine, scoped to
    // exactly what TODO.md agreed: the power rule (n != -1, plus the
    // n=-1 -> ln(x) special case), sin/cos/exp, a constant-base
    // exponential (b^x -> b^x/ln(b), e^x special-cased to skip the
    // ln(e) factor), linearity (sum/difference of integrable terms),
    // constant-factor pull-out, and "simple composition" ONLY via linear
    // substitution f(ax+b) — never a general u-substitution. \tan/\ln/
    // \log are explicitly OUT OF SCOPE (not "not yet implemented" —
    // deliberately excluded, see TODO.md: \tan needs a substitution
    // producing a non-elementary intermediate without more machinery,
    // \ln needs integration by parts, both excluded on purpose this
    // phase). Anything this engine can't handle THROWS, uncaught, all
    // the way up through every recursive call (never swallowed partway
    // through a sum/product) so the trigger's try/catch below leaves the
    // WHOLE integral unevaluated — same "leave it alone, don't guess"
    // failure UX as a numeric line referencing an undefined variable.

    // Does `node` equal a*v + b for some a/b constant w.r.t. v (not
    // necessarily literal numbers)? Returns {a, b} tree nodes, or null
    // if `node` isn't recognizably linear in v. Deliberately structural
    // and narrow (var-is-v, constant, neg, add, sub, mul-by-constant) —
    // NOT a general "solve for linear form" routine; this is exactly
    // what bounds the "simple composition" scope to f(ax+b) and nothing
    // more open-ended (e.g. it correctly returns null for x^2 inside a
    // sin(), which is what makes the non-linear-composition case below
    // fail gracefully instead of guessing).
    function linearCoeffs(node, v) {
      if (node.type === "var" && node.name === v) return { a: numNode(1), b: numNode(0) };
      if (!containsVar(node, v)) return { a: numNode(0), b: node };
      if (node.type === "neg") {
        var inner = linearCoeffs(node.arg, v);
        return inner ? { a: negNode(inner.a), b: negNode(inner.b) } : null;
      }
      if (node.type === "add") {
        var l = linearCoeffs(node.left, v), r = linearCoeffs(node.right, v);
        return (l && r) ? { a: addNode(l.a, r.a), b: addNode(l.b, r.b) } : null;
      }
      if (node.type === "sub") {
        var l2 = linearCoeffs(node.left, v), r2 = linearCoeffs(node.right, v);
        return (l2 && r2) ? { a: subNode(l2.a, r2.a), b: subNode(l2.b, r2.b) } : null;
      }
      if (node.type === "mul") {
        if (!containsVar(node.left, v)) {
          var ri = linearCoeffs(node.right, v);
          return ri ? { a: mulNode(node.left, ri.a), b: mulNode(node.left, ri.b) } : null;
        }
        if (!containsVar(node.right, v)) {
          var li = linearCoeffs(node.left, v);
          return li ? { a: mulNode(node.right, li.a), b: mulNode(node.right, li.b) } : null;
        }
        return null;
      }
      return null;
    }

    // Multiplies a pulled-out constant factor `k` onto an already-
    // integrated `inner` result, folding a leading negation out front
    // (mul(k, neg(a)) -> neg(mul(k, a))) rather than leaving a bare
    // "k \cdot -a" in the rendered result. simplifyTree() deliberately
    // has no general "pull negation out of a mul" fold (not its scope —
    // phase 1 never needed one), so this is handled locally here
    // instead of extending simplifyTree's own job. Runs simplifyTree()
    // on `inner` FIRST because the shape integrateCall()'s sin/cos/exp
    // rules actually build (e.g. div(neg(cos(x)), num(1)) for a plain
    // "\int\sin(x)dx", before the division-by-1 fold has had a chance
    // to run yet) isn't a bare neg() node until that fold happens —
    // confirmed by a failing Node-level test before this call was added
    // here (see this phase's PROGRESS.md entry).
    function mulPullConst(k, inner) {
      var s = simplifyTree(inner);
      if (s.type === "neg") return negNode(mulNode(k, s.arg));
      return mulNode(k, s);
    }

    // Reads a tree node as a plain numeric exponent, matching the same
    // leniency parseLatexToTree's own parsePowT/parseUnaryT already
    // produce: a typed "x^-1" parses as pow(x, neg(num(1))), NOT
    // pow(x, num(-1)) — parseUnaryT wraps a leading "-" in its own
    // neg() node rather than folding the sign into the literal. Returns
    // the numeric value, or null if `node` isn't one of these two
    // shapes, so a genuinely symbolic exponent (e.g. x^n) still fails
    // gracefully instead of being misread as some specific number.
    function numericExpValue(node) {
      if (node.type === "num") return node.value;
      if (node.type === "neg" && node.arg.type === "num") return -node.arg.value;
      return null;
    }

    // sin/cos/exp standard forms, with linear substitution via
    // linearCoeffs(). tan/ln/log are explicitly out of scope for this
    // phase (see this section's header comment) — thrown here, caught
    // by matchIntegralTrigger()'s caller's own try/catch, same
    // "leave it alone" graceful-failure UX as everything else in this
    // app's evaluation paths.
    function integrateCall(node, v) {
      var name = node.name, arg = node.arg;
      if (name === "tan" || name === "ln" || name === "log") {
        throw new Error("integration: \\" + name + " is out of scope for this phase");
      }
      if (name !== "sin" && name !== "cos" && name !== "exp") {
        throw new Error("integration: don't know how to integrate " + name);
      }
      var lc = linearCoeffs(arg, v);
      if (!lc) throw new Error("integration: non-linear composition for " + name + "(...) is not supported");
      if (name === "sin") return divNode(negNode(callNode("cos", arg)), lc.a);
      if (name === "cos") return divNode(callNode("sin", arg), lc.a);
      return divNode(callNode("exp", arg), lc.a); // "exp"
    }

    // The actual integration engine — see this section's header comment
    // for the agreed scope. Returns a brand-new tree, the antiderivative
    // of `node` with respect to `v` (no "+C" — this is a formula result,
    // same convention as phase 1's derivative; adding a constant of
    // integration is a presentation choice left for later, not a
    // correctness requirement of this engine).
    function integrate(node, v) {
      // Constant w.r.t. v (doesn't reference it anywhere, not just "is
      // a literal number" — same distinction containsVar() already
      // draws for phase 1's differentiate()): integral of a constant k
      // is k*v. This also catches every "other variable" case (e.g.
      // integrating "y" with respect to "x") the same way phase 1's
      // differentiate() does.
      if (!containsVar(node, v)) return mulNode(node, varNode(v));
      switch (node.type) {
        case "var": // node.name === v here (the other-variable case is constant, handled above)
          return divNode(powNode(node, numNode(2)), numNode(2));
        case "neg":
          return negNode(integrate(node.arg, v));
        case "add":
          return addNode(integrate(node.left, v), integrate(node.right, v));
        case "sub":
          return subNode(integrate(node.left, v), integrate(node.right, v));
        case "mul": {
          if (!containsVar(node.left, v)) return mulPullConst(node.left, integrate(node.right, v));
          if (!containsVar(node.right, v)) return mulPullConst(node.right, integrate(node.left, v));
          // Both sides depend on v: this is the open-ended "recognize an
          // arbitrary inner function's derivative as a factor" problem
          // (e.g. 2x\sin(x^2)) — explicitly out of scope, see this
          // section's header comment. Fail gracefully rather than guess.
          throw new Error("integration: a product of two non-constant factors is not supported (not simple u-substitution)");
        }
        case "div":
          // Rewrite a/b as a*b^-1 and reuse the mul (constant pull-out)
          // and pow (power rule, including n=-1 -> ln) cases above/below
          // — avoids a third copy of the same "is this side constant"
          // logic for what's structurally the same question.
          return integrate(mulNode(node.left, powNode(node.right, numNode(-1))), v);
        case "pow": {
          var baseHasV = containsVar(node.base, v), expHasV = containsVar(node.exp, v);
          if (baseHasV && expHasV) {
            throw new Error("integration: a variable base raised to a variable exponent (f(x)^g(x)) is not supported");
          }
          if (expHasV) {
            // Constant-base exponential: b^f(x), f linear in v (covers
            // both e^x and e^{2x} via the same path — "e" is just an
            // ordinary var node to this layer, same as phase 1's own
            // documented exponential-rule note).
            var lcExp = linearCoeffs(node.exp, v);
            if (!lcExp) throw new Error("integration: non-linear exponent is not supported");
            var isE = node.base.type === "var" && node.base.name === "e";
            var denom = isE ? lcExp.a : mulNode(callNode("ln", node.base), lcExp.a);
            return divNode(node, denom);
          }
          // baseHasV, exponent constant: power rule, with linear
          // substitution on the base. Scope deliberately excludes a
          // non-numeric exponent (e.g. x^n for a symbolic n) — can't
          // tell whether n=-1 without a literal value, so fail
          // gracefully rather than guess.
          var n = numericExpValue(node.exp);
          if (n === null) {
            throw new Error("integration: a non-numeric exponent on a variable base is not supported");
          }
          var lcBase = linearCoeffs(node.base, v);
          if (!lcBase) throw new Error("integration: non-linear composition in a power's base is not supported");
          if (n === -1) return divNode(callNode("ln", node.base), lcBase.a);
          var np1 = n + 1;
          return divNode(powNode(node.base, numNode(np1)), mulNode(numNode(np1), lcBase.a));
        }
        case "call":
          return integrateCall(node, v);
      }
      throw new Error("integration: unsupported expression form");
    }

    // The user-facing trigger. Ctrl+Shift+I (see the keydown handler
    // below) inserts "\int" followed immediately by an auto-paired "("
    // — confirmed live (headless Chromium over the DevTools Protocol,
    // loading this project's actual mathquill.min.js/jquery.min.js) that
    // mathField.cmd("\\int") on a real MathQuill field inserts a bare,
    // slot-less symbol — NOT a sum/product-style template with sub/
    // superscript boxes the way \Sigma/\Pi are (ruling out the obvious
    // "leave the bounds empty for an indefinite integral" approach,
    // since there are no bounds slots to leave empty here at all) — and
    // that typing a bare "(" right after it opens the exact same
    // "\left(...\right)" auto-pairing every other typed paren in this
    // app already gets (confirmed: cmd("\\int") then typedText("(")
    // produces "\int\left(\right)" with the cursor positioned between
    // them). The paren wrapper isn't cosmetic: also confirmed live that
    // typing a "/" immediately after a bare "\int" with NO boundary in
    // between makes MathQuill's own auto-fraction grab the "\int" symbol
    // itself into the numerator (cmd("\\int") then typedText("1/x")
    // produces "\frac{\int1}{x}", not "\int\frac{1}{x}" — MathQuill's
    // "/" handler grabs back everything un-separated in the current
    // block, and a bare symbol with no operator next to it doesn't stop
    // that grab the way a "+" does). The paren group gives the
    // integrand its own block boundary for that grab to stop at instead,
    // which is what makes an integrand containing a fraction (the n=-1
    // case, 1/x, specifically included) typeable at all. The resulting
    // keystroke discipline this requires (exit a fraction/exponent with
    // Right before typing the closing ")", so it skips over the pending
    // auto-inserted "\right)" instead of opening a confusing SECOND
    // nested paren) is not a new fragility this feature introduces —
    // it's the exact same discipline every other nested MathQuill
    // construct in this app already needs (see the "^ doesn't auto-exit"
    // lesson in this agent's own notes), just applied to this new
    // construct too.
    //
    // Detection is purely textual, same convention matchDerivativeTrigger()
    // above already established: requires the whole expression to start
    // with "\int" (so it can only ever be this feature — nothing else in
    // this app ever emits "\int"), and to end with a literal "d"
    // immediately followed by one identifier token (matchIdentifierAt())
    // and nothing else after it — same "denominator" shape check
    // matchDerivativeTrigger() uses, just anchored at the end of the
    // string instead of inside a \frac{}{}'s second group. Whatever's
    // between those two anchors — normally "\left(...\right)" from the
    // auto-pairing above — is fed to parseLatexToTree() as-is: its own
    // parenthesis handling in parseAtomT() already strips a leading
    // "\left(...\right)"/"(...)" wrapper for free, so no separate brace/
    // paren extractor is needed here the way matchDerivativeTrigger()
    // needed extractBraceGroup() for \frac{}{}'s two explicit groups.
    // Returns {varName, exprLatex} on a match, or null (so the caller
    // falls through to the ordinary numeric evaluateLatex() path, same
    // as it already does for anything else it can't evaluate) otherwise.
    function matchIntegralTrigger(latex) {
      if (latex.indexOf("\\int") !== 0) return null;
      var body = latex.slice(4).replace(/\s+$/, "");
      var dPos = body.lastIndexOf("d");
      if (dPos < 0 || dPos === body.length - 1) return null;
      var varTok = matchIdentifierAt(body, dPos + 1);
      if (varTok === null || dPos + 1 + varTok.length !== body.length) return null;
      var integrandLatex = body.slice(0, dPos).trim();
      if (integrandLatex === "") return null;
      return { varName: varTok, exprLatex: integrandLatex };
    }

    // The user-facing trigger: Leibniz notation, typed exactly the way
    // this app's own "/" shortcut already behaves (MathQuill auto-opens
    // \frac{}{} on a typed "/" with no special-casing needed here) —
    // "d", "/", "d", "<var>", Right (to exit the denominator), then the
    // expression to differentiate. Recognized ONLY when the fraction's
    // numerator is exactly "d" and the denominator is exactly "d"
    // followed by one identifier token (matchIdentifierAt) and nothing
    // else — confirmed live (headless Chromium over the DevTools
    // Protocol) that typing that exact key sequence produces precisely
    // "\frac{d}{dx}" (the denominator's "d" and "x" are two separate
    // single-letter MathQuill nodes with no separator between them, same
    // as any other two adjacent typed letters), so this string match is
    // not a guess. Distinguishes this from an ordinary typed fraction
    // (literal division) purely by the numerator/denominator shape — an
    // ordinary "\frac{a}{b}" never matches ("a" alone only passes if the
    // user's variable happens to be named "d", and even then the
    // denominator must ALSO start with "d" immediately followed by one
    // more bare identifier and nothing else, which an ordinary division
    // essentially never looks like).
    // Returns {varName, exprLatex} on a match, or null (so the caller
    // falls through to the ordinary numeric evaluateLatex() path, same
    // as it already does for anything else it can't evaluate) otherwise.
    function matchDerivativeTrigger(latex) {
      if (latex.indexOf("\\frac{") !== 0) return null;
      var g1 = extractBraceGroup(latex, 5);
      if (!g1 || g1.content.trim() !== "d") return null;
      var g2 = extractBraceGroup(latex, g1.end);
      if (!g2) return null;
      var denom = g2.content.trim();
      if (denom[0] !== "d") return null;
      var varToken = matchIdentifierAt(denom, 1);
      if (varToken === null || 1 + varToken.length !== denom.length) return null;
      var rest = latex.slice(g2.end).trim();
      if (rest === "") return null;
      return { varName: varToken, exprLatex: rest };
    }

    // The "formula result" display mechanism: a read-only MQ.StaticMath
    // rendering of a LaTeX string, appended as a sibling of the line's
    // own field — same spirit, and same DOM placement, as
    // appendMatrixResult() above (a dedicated result area distinct from
    // the plain typed-in-place numeric "=" output), but for an arbitrary
    // rendered formula instead of a matrix grid. Deliberately generic
    // (any LaTeX string in, no derivative-specific assumptions) so the
    // integral-phase delegation can call this exact same function for
    // its own antiderivative result instead of rebuilding a second
    // result-display mechanism.
    function appendFormulaResult(line, latex) {
      var wrap = document.createElement("span");
      wrap.className = "result-formula";
      line.el.appendChild(wrap);
      MQ.StaticMath(wrap).latex(latex);
      line.resultFormulaEl = wrap;
    }

    // Evaluates everything on the line BEFORE the "=" the user just typed
    // (exprLatex, captured before insertion) and types the result after it.
    // Leaves just the "=" if the expression can't be evaluated yet (e.g. it
    // references a variable that hasn't been defined above).
    //
    // The derivative and integral triggers are both checked FIRST,
    // before any of evaluateLatex()'s own numeric path runs at all — a
    // line matching either one is routed entirely to the symbolic tree
    // layer above and never reaches collectDefinitions()/evaluateLatex(),
    // so an ordinary line (which never matches either trigger) takes the
    // exact same path through this function it always has. The two
    // triggers' prefixes ("\frac{d}{..." vs "\int...") are mutually
    // exclusive, so checking order between them doesn't matter.
    function evaluateAndAppend(line, exprLatex) {
      var deriv = matchDerivativeTrigger(exprLatex);
      if (deriv) {
        try {
          var tree = parseLatexToTree(deriv.exprLatex);
          var dtree = simplifyTree(differentiate(tree, deriv.varName));
          appendFormulaResult(line, treeToLatex(dtree));
        } catch (e) { /* leave just the "=" , same as a numeric failure */ }
        return;
      }
      var integ = matchIntegralTrigger(exprLatex);
      if (integ) {
        try {
          var itree = parseLatexToTree(integ.exprLatex);
          var rtree = simplifyTree(integrate(itree, integ.varName));
          appendFormulaResult(line, treeToLatex(rtree));
        } catch (e) { /* leave just the "=" , same as a numeric/derivative failure */ }
        return;
      }
      try {
        var defs = collectDefinitions(line);
        var result = evaluateLatex(exprLatex, defs.vars, defs.funcs);
        if (isMatrixValue(result)) appendMatrixResult(line, result.rows);
        else line.mathField.typedText(formatNumber(result));
      } catch (e) { /* leave just the "=" */ }
    }

    // Renders a matrix-valued "=" result (transpose(A), A^T, A^-1, ...)
    // as an actual typeset matrix, appended as a sibling of the line's
    // own MathQuill field rather than typed into it.
    //
    // This is a deliberate pivot from the original "unvalidated" idea
    // in TODO.md (write matrixLatex()'s "\begin{bmatrix}...\end{bmatrix}"
    // string into the field via MathField.write()) — checked
    // empirically (a throwaway MathField, write() with that exact
    // string, then reading .latex() back) before writing any of this:
    // this bundled MathQuill build has NO "bmatrix"/"array" environment
    // support at all (grepped mathquill.min.js for every literal
    // "\command" token it defines — "matrix"/"array" never appear), so
    // write() with that string silently leaves the field empty rather
    // than rendering anything. matrixLatex() producing that string is
    // still correct and is kept exactly as-is — it's only ever handed
    // to the C++ Backend for export, which has a real LaTeX engine
    // behind it, not MathQuill.
    //
    // The actual mechanism: reuse the exact same bracket+grid DOM/CSS
    // an editable matrix LINE already uses (see convertToMatrix() et
    // al.), just built here as a small read-only widget instead of a
    // whole line, with each cell rendered via MQ.StaticMath (display-
    // only MathQuill, never focusable/editable) instead of MQ.MathField.
    function appendMatrixResult(line, rows) {
      var wrap = document.createElement("span");
      wrap.className = "result-matrix";
      var leftBracket = document.createElement("span");
      leftBracket.className = "matrix-bracket matrix-bracket-left";
      var grid = document.createElement("span");
      grid.className = "matrix-grid";
      var cols = rows.length ? rows[0].length : 0;
      grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(1.2em, max-content))";
      var rightBracket = document.createElement("span");
      rightBracket.className = "matrix-bracket matrix-bracket-right";
      rows.forEach(function (row, r) {
        row.forEach(function (val, c) {
          var cellEl = document.createElement("span");
          cellEl.className = "matrix-cell";
          cellEl.style.gridRow = r + 1;
          cellEl.style.gridColumn = c + 1;
          grid.appendChild(cellEl);
          MQ.StaticMath(cellEl).latex(formatNumber(val));
        });
      });
      wrap.appendChild(leftBracket);
      wrap.appendChild(grid);
      wrap.appendChild(rightBracket);
      line.el.appendChild(wrap);
      line.resultMatrixEl = wrap;
    }

    // The single place that types one character into a math line's field,
    // used both for live keystrokes (the global listener below) and for
    // replaying a pending line's buffered text once it's decided to become
    // a math line (convertToMath). A handful of characters get special
    // treatment instead of being typed literally — see each branch.
    function insertChar(line, ch) {
      var mathField = line.mathField;
      if (ch === ":") mathField.typedText(":=");
      // Mathcad's own shortcut for its range operator: typing ";" inserts
      // the range marker, as in "i:=0;10" rendering as "i := 0…10" (see
      // parseRangeDefinition()). This uses \ldots (a single atomic symbol)
      // rather than typing ".." literally — MathQuill treats two typed "."
      // right after a digit as "just one decimal point, thanks" and drops
      // the second one, which would silently break "0..10" into "0.10".
      else if (ch === ";") mathField.cmd("\\ldots");
      // Mathcad's own bare (unmodified) shortcuts for the summation/
      // product operators that work over a range variable — "$" is
      // Shift+4, "#" is Shift+3 on a US keyboard, same as Mathcad.
      else if (ch === "$") mathField.cmd("\\Sigma");
      else if (ch === "#") mathField.cmd("\\Pi");
      else if (ch === "\\") mathField.cmd("\\sqrt");
      else if (ch === "|") mathField.cmd("\\nthroot");
      else if (ch === "=") {
        var exprLatex = mathField.latex();
        // A line that's ALSO a definition so far ("name:=rhs" typed,
        // then "=") should show the value just defined, not fail
        // trying to evaluate "name" as though it already had one —
        // collectDefinitions() never hits this (it already strips the
        // "name:=" prefix via parseDefinitionLHS() before evaluating
        // the rhs); this mirrors that same stripping here so "=" on
        // this kind of line evaluates the RHS, the same thing the name
        // is about to be bound to, rather than the whole "name:=rhs"
        // text (where "name" reads as an undefined reference to
        // itself). Found live while testing a matrix-valued definition
        // ("B:=A^T=") — but it's not matrix-specific: a bare scalar
        // ("x:=5=") hit the exact same failure before this fix, this
        // combination (define-and-immediately-show on one line) simply
        // hadn't been exercised before. A function definition ("f(x):=
        // ...") isn't affected either way — parseDefinitionLHS() only
        // recognizes a plain "name:=", so afterName here won't start
        // with ":=" for one, and exprLatex is used as-is, same as
        // before this fix.
        var lhsSoFar = parseDefinitionLHS(exprLatex);
        var toEval = (lhsSoFar && lhsSoFar.rest.indexOf(":=") === 0) ? lhsSoFar.rest.slice(2) : exprLatex;
        // Jump out of whatever block the cursor is sitting in (e.g. a root's
        // radicand) first, so "=" and the result land after the whole
        // expression instead of extending the root's bar over them too.
        mathField.moveToRightEnd();
        mathField.typedText("=");
        evaluateAndAppend(line, toEval);
      } else mathField.typedText(ch);
    }

    // Turns a pending line into a regular math line: swaps its plain div
    // for a MathQuill field, wires up Enter/Backspace/Left/Right to chain
    // to the next/previous line, and replays whatever text the user had
    // already typed (the character that made this stop being "pending",
    // e.g. a single "/" that should open a fraction) through insertChar()
    // so it's interpreted the same way a live keystroke would be.
    function convertToMath(line, buffered) {
      var container = document.createElement("span");
      container.className = "line math-line";
      line.el.replaceWith(container);
      line.el = container;
      line.type = "math";
      var mathField = MQ.MathField(container, {
        handlers: {
          enter: function () { onEnter(line); },
          deleteOutOf: function (dir) { onDeleteOutOf(line, dir); },
          moveOutOf: function (dir) { onMoveOutOf(line, dir); },
          // A matrix-valued "=" result (see appendMatrixResult()) is a
          // separate DOM sibling, not part of the field's own LaTeX, so
          // it doesn't automatically disappear the way a scalar result
          // does when the field it was typed into gets edited. "edit"
          // fires on every content change to this field, live keystroke
          // or programmatic (typedText/cmd) alike, so any edit after a
          // matrix result was shown — including backspacing the "="
          // that produced it — clears the now-stale widget; retyping
          // "=" recomputes and re-appends a fresh one. A formula result
          // (see appendFormulaResult() — currently only a symbolic
          // derivative) is the exact same kind of DOM sibling and needs
          // the same stale-widget cleanup.
          edit: function () {
            if (line.resultMatrixEl) { line.resultMatrixEl.remove(); line.resultMatrixEl = null; }
            if (line.resultFormulaEl) { line.resultFormulaEl.remove(); line.resultFormulaEl = null; }
            completionOnFieldEdited(mathField);
          }
        }
      });
      line.mathField = mathField;
      container._line = line;
      for (var k = 0; k < buffered.length; k++) insertChar(line, buffered[k]);
      // The completion feature's own keydown-based letter tracking (see the
      // "Inline code-completion" block above) can't resolve a field for the
      // very FIRST keystroke on a brand-new pending line — the same timing
      // gap the Greek-letter shortcut hit for the same reason (see this
      // file's dated lessons): that keydown is capture-handled before THIS
      // function (triggered by the "input" event it causes) has even
      // created the field yet, so resolveMathField() has nothing to return
      // for it. Seed tracking here instead, from the buffered text this
      // conversion is replaying anyway, so a function name typed as
      // literally the first characters on a brand-new line (e.g. typing
      // "sin(x)" right after Enter) is tracked from its very first letter,
      // not just from the second one on. Confirmed empirically (a CDP-
      // driven headless-Chromium run dispatching real keydown events, the
      // same rigor every other MathQuill claim in this file gets) that
      // without this, completion.buffer silently started one character
      // late on a fresh line, with no error — e.g. typing "det(" tracked
      // only "et", which matches no candidate at all.
      if (buffered && /^[a-z]+$/.test(buffered)) {
        updateCompletionBuffer(mathField, buffered);
        completionOnFieldEdited(mathField);
      }
      mathField.focus();
    }

    // A matrix is its own line type: a grid of small MathQuill fields (one
    // per cell) between two CSS-drawn brackets, rather than a single field.
    // "," appends a cell to the current row, ";" starts a new row, and
    // Backspace/Tab chain the cells together the same way lines chain.
    // line.rows is a 2D array mirroring the grid: line.rows[r][c] is the
    // MathQuill field for that cell (or undefined if it doesn't exist).
    function focusCell(line, r, c) {
      if (line.rows[r] && line.rows[r][c]) line.rows[r][c].focus();
    }

    // Adds a new, empty row to the matrix's bookkeeping (line.rows) and
    // returns its index. Doesn't touch the DOM or create any cells itself
    // — callers immediately follow this with addCellToRow() to actually
    // give the new row its first cell.
    function addRow(line) {
      line.rows.push([]);
      return line.rows.length - 1;
    }

    // Finds the DOM element for a given cell by the data-row/data-col
    // attributes addCellToRow() stamps onto it. Only needed for removing a
    // cell (matrixDeleteOutOf) — day-to-day focus/typing goes through the
    // MathQuill field stored in line.rows, never the element directly.
    function cellElementAt(line, r, c) {
      return line.grid.querySelector('.matrix-cell[data-row="' + r + '"][data-col="' + c + '"]');
    }

    // Widens the grid's column count if this cell needs a column further
    // right than any seen so far. Columns only ever grow, never shrink —
    // removing the last cell in the widest column leaves a harmlessly
    // unused (zero-width, since nothing occupies it) column track behind.
    function growMatrixColumns(line, atLeast) {
      var cols = Math.max(line.maxCols || 0, atLeast);
      if (cols === line.maxCols) return;
      line.maxCols = cols;
      line.grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(1.2em, max-content))";
    }

    // Appends one new cell (a MathQuill field) to the end of row `r` and
    // returns it. All cells are direct children of the matrix's one CSS
    // grid — placed by explicit grid-row/grid-column rather than nested
    // inside a per-row container — so every row shares the same column
    // tracks: a column's width is set by its widest cell, and narrower
    // ones (e.g. "1" under "10") sit centered within that shared width.
    function addCellToRow(line, r) {
      var c = line.rows[r].length;
      var cellEl = document.createElement("span");
      cellEl.className = "matrix-cell";
      cellEl.dataset.row = r;
      cellEl.dataset.col = c;
      // CSS grid lines are 1-indexed, hence the +1s.
      cellEl.style.gridRow = r + 1;
      cellEl.style.gridColumn = c + 1;
      line.grid.appendChild(cellEl);
      growMatrixColumns(line, c + 1);
      var mathField = MQ.MathField(cellEl, {
        handlers: {
          enter: function () { exitMatrix(line); },
          deleteOutOf: function (dir) { matrixDeleteOutOf(line, r, c, dir); },
          moveOutOf: function (dir) { matrixMoveOutOf(line, r, c, dir); },
          // Unlike a math-line/graph-line field, a matrix cell had no
          // "edit" handler at all before this feature — added purely so
          // completionOnFieldEdited() has the same post-edit hook to
          // render/reposition the dropdown against here as the other two
          // field shapes already get.
          edit: function () { completionOnFieldEdited(mathField); }
        }
      });
      // Lets the global keydown listener (which only has the DOM event's
      // target to start from) map a cell back to its line and position —
      // the same role cellEl.dataset.row/col play for cellElementAt(), but
      // as live object references instead of strings for quick access.
      cellEl._line = line;
      cellEl._row = r;
      cellEl._col = c;
      line.rows[r].push(mathField);
      return mathField;
    }

    // Enter handler shared by every matrix cell: finishes the matrix
    // entirely and moves to a new line below it, the same as onEnter()
    // does for a regular math line.
    function exitMatrix(line) {
      focusLine(insertLineAfter(line));
    }

    // Stepping out of the matrix forward never dead-ends: if there's no
    // next line yet, one is created, the same way Enter always gets you
    // somewhere. Stepping out backward only moves to a line that already
    // exists — inserting a blank one above would be more surprising there.
    function exitMatrixForward(line) {
      focusLine(lines[indexOf(line) + 1] || insertLineAfter(line));
    }
    function exitMatrixBackward(line) {
      var prev = lines[indexOf(line) - 1];
      if (prev) focusLine(prev, true);
    }

    // Left/Right at a cell's edge (nothing left to move into within it)
    // steps to the next cell, wrapping at row boundaries — the same hook
    // regular math lines use to chain Left/Right between lines. At the
    // outer edge of the whole matrix, it steps out to the adjacent
    // notebook line instead of getting stuck.
    function matrixMoveOutOf(line, r, c, dir) {
      if (dir === MQ.L) {
        if (c > 0) focusCell(line, r, c - 1);
        else if (r > 0) focusCell(line, r - 1, line.rows[r - 1].length - 1);
        else exitMatrixBackward(line);
      } else if (dir === MQ.R) {
        if (c < line.rows[r].length - 1) focusCell(line, r, c + 1);
        else if (r < line.rows.length - 1) focusCell(line, r + 1, 0);
        else exitMatrixForward(line);
      }
    }

    // Reverses convertToMatrix: turns the (now-empty) matrix line back into
    // a plain editable pending line, the same way an empty heading or math
    // line disappears when you backspace through it.
    function revertToPending(line) {
      var el = document.createElement("div");
      el.className = "line pending";
      el.contentEditable = "true";
      el.spellcheck = false;
      line.el.replaceWith(el);
      line.el = el;
      line.type = "pending";
      el._line = line;
      delete line.rows;
      delete line.grid;
      delete line.name;
      wireLineKeydown(line);
      wirePendingInput(line);
      return line;
    }

    // Only the trailing cell (last column of the last row) deletes anything;
    // backspacing inside an earlier empty cell is left to MathQuill (nothing
    // to delete there, so it's a no-op), which keeps this simple.
    function matrixDeleteOutOf(line, r, c, dir) {
      if (dir !== MQ.L) return;
      var lastRow = line.rows.length - 1;
      var lastCol = line.rows[lastRow].length - 1;
      if (r !== lastRow || c !== lastCol) return;

      if (line.rows.length === 1 && line.rows[0].length === 1) {
        focusLine(revertToPending(line), true);
        return;
      }
      var el = cellElementAt(line, r, c);
      if (el) el.remove();
      line.rows[r].pop();
      if (line.rows[r].length === 0) {
        line.rows.pop();
        focusCell(line, line.rows.length - 1, line.rows[line.rows.length - 1].length - 1);
      } else {
        focusCell(line, r, line.rows[r].length - 1);
      }
    }

    // Shared by convertToMatrix() (unnamed, "[" on a pending line) and
    // convertMathToMatrix() (named, "A:[" on a math line already
    // showing "A:="): builds the bracket+grid DOM structure (see the
    // .matrix-line CSS) and, when `name` is given, a label in front of
    // it ("A := "), mirroring how a graph line's "y ="/"z =" label
    // (yLabelEl) sits to the left of its own field. Does not add any
    // rows/cells itself — every caller follows this with addRow()+
    // addCellToRow() for the starting 1x1 cell.
    function buildMatrixContainer(line, name) {
      var container = document.createElement("div");
      container.className = "line matrix-line";
      line.el.replaceWith(container);
      line.el = container;
      line.type = "matrix";
      line.rows = [];
      line.name = name || null;

      if (line.name) {
        var nameLabel = document.createElement("span");
        nameLabel.className = "matrix-name-label";
        nameLabel.textContent = line.name + " := ";
        container.appendChild(nameLabel);
      }

      var leftBracket = document.createElement("div");
      leftBracket.className = "matrix-bracket matrix-bracket-left";
      var grid = document.createElement("div");
      grid.className = "matrix-grid";
      var rightBracket = document.createElement("div");
      rightBracket.className = "matrix-bracket matrix-bracket-right";
      container.appendChild(leftBracket);
      container.appendChild(grid);
      container.appendChild(rightBracket);
      line.grid = grid;
    }

    // Turns a pending line into an UNNAMED matrix: Mathcad's own bare
    // "[" shortcut (see wirePendingInput()). Adds one empty row with one
    // empty cell and focuses it — the starting point for a brand-new
    // 1x1 matrix the user can grow with "," and ";". Can't be referenced
    // from any later line (see collectDefinitions()) — only a NAMED
    // matrix (convertMathToMatrix() below) can.
    function convertToMatrix(line) {
      buildMatrixContainer(line, null);
      var r = addRow(line);
      addCellToRow(line, r).focus();
    }

    // Turns an in-progress definition ("A:=", a math line showing just
    // an identifier name and ":=" so far — see the global keydown
    // listener's "[" handling below) into a NAMED matrix: the Mathcad-
    // style equivalent of "A:3" becoming the math line "A := 3", just
    // for a matrix value instead of a scalar one. A named matrix line
    // IS a real value collectDefinitions() reads (see its "l.name"
    // check), the same way "A:=3" defines a usable variable.
    function convertMathToMatrix(line, name) {
      buildMatrixContainer(line, name);
      var r = addRow(line);
      addCellToRow(line, r).focus();
    }

    // The LaTeX form used for export: a standard bmatrix environment,
    // prefixed with "name:=" for a named matrix (matching how every
    // other definition exports: see collectDocument()'s "math" case for
    // a plain line, which already includes its own ":=").
    function matrixLatex(line) {
      var rows = line.rows.map(function (row) {
        return row.map(function (field) { return field.latex(); }).join(" & ");
      });
      var body = "\\begin{bmatrix}" + rows.join(" \\\\ ") + "\\end{bmatrix}";
      return line.name ? line.name + ":=" + body : body;
    }

    // --- Program blocks: the editor (TODO.md's "program blocks" item —
    // the UI half; the pure-logic interpreter is above, right before
    // formatNumber()). A "program" line is its own line type, same
    // dispatch pattern as "math"/"matrix"/"graph" everywhere else in this
    // file — see focusLine()/collectDocument()/collectDefinitions() for
    // the new case each of those dispatchers needed, per this project's
    // own hard-won lesson (.claude/agents/frontend.md) about grepping
    // EVERY line.type switch, not just the one being worked on.
    //
    // Shape: line.statements is the flat top-level sequence (§6 of the
    // spec: any number of local assignments, for/while loops, if/
    // otherwise branches, and return/break/continue statements, in any
    // order) — each entry is the same {kind, field/varField/collField/
    // condField, body/thenBody/elseBody} shape runProgram() above already
    // consumes. A structural statement's own body can hold another for/
    // while/if too — nesting is unrestricted, at any depth. (TODO.md's
    // original v1 scope capped this at one level of nesting and at most
    // one loop/one if; that cap was lifted — see insertStructural()'s own
    // comment for why removing it needed almost no code change.)
    //
    // Visual grouping (§7): a single left brace-like bracket spans the
    // whole block, reusing the exact same CSS border-based bracket
    // technique a matrix's own brackets already use (see the .matrix-
    // bracket-left CSS rule's own comment for why a border, not a
    // stretched glyph) rather than attempting an actual curly-brace
    // character — simplified on purpose, consistent with this project's
    // IP-respect rule (the functional idea of brace-grouping is fine to
    // reuse, a specific app's exact rendering of it is not something
    // this needed to chase anyway, since nothing here was copied from
    // one). Nested for/while/if bodies are indented via CSS padding
    // only, no second bracket.
    //
    // Keyboard interaction model actually settled on, after trying (and
    // rejecting) a per-structure bespoke navigation scheme: every
    // for/while/if's header field(s) plus every assign/return
    // statement's single field are flattened into ONE reading-order list
    // (programFieldList() below) by walking the statement tree exactly
    // once per keystroke — Left/Right/Tab/Shift+Tab at a field's edge
    // just steps to the adjacent entry in that flat list (or out to the
    // notebook line above/below at either end), the same "step to
    // whatever's next in reading order" idea onMoveOutOf() already uses
    // for ordinary math lines and matrixMoveOutOf() uses for matrix
    // cells, just computed fresh each time instead of kept as static
    // row/column indices (nothing here is a fixed grid, so there's
    // nothing to precompute and cache). Enter always means "add a new
    // plain assign statement right after whichever statement contains
    // the focused field, in that statement's own list" — a header field
    // of an EMPTY for/while/if (nothing in its body yet) is special-cased
    // to mean "start this structure's body" instead of "add a sibling
    // after the whole structure", since that's the only way to ever get
    // a first statement into a loop/if body at all. Backspace on an
    // EMPTY field removes that one assign/return/break/continue
    // statement and, if that was the program's only remaining top-level
    // statement, reverts the whole line back to a blank pending line,
    // mirroring convertToMatrix's own revertToPending() for an emptied
    // 1x1 matrix. Backspace on a for/while/if's FIRST header field
    // (a `for`'s "var", a `while`/`if`'s "cond") ALSO deletes the whole
    // structure, but only when it's still pristine — untouched since
    // insertion, i.e. every header field is empty and its body (both
    // bodies, for `if`) is still exactly the one starter "assign"
    // statement it was created with, itself still empty too (see
    // isStructurePristine() below). This was deliberately scoped to
    // "pristine only", not "always delete on empty header": a `for`/
    // `while`/`if` typed into even partially (a condition filled in, a
    // body statement edited) could easily have real work buried deeper
    // in its tree that a Backspace on one empty header field should
    // never silently discard — the same reasoning `revertToPending()`
    // already applies to a matrix (an emptied matrix reverts, but a
    // matrix with real content in some other cell never does by this
    // route). A `for`'s SECOND header field ("coll") never deletes the
    // structure even when pristine — Backspace there is intra-structure
    // navigation back to "var", not a deletion gesture, since "coll"
    // being empty while "var" already has a name typed into it isn't
    // "untouched" by any reasonable reading.
    //
    // Inserting a for/while/if/break/continue/return itself needs its
    // own keystroke, since none of them is a character a user would
    // otherwise type into a field — see the Ctrl+Shift+R/W/N/B/T/E
    // bindings in the global keydown listener further below for exactly
    // which letter was picked for which and why (Mathcad itself has no
    // bare-key convention for any of these; its real Programming toolbar
    // inserts them by click, not keystroke, confirmed the same
    // web-searched-PTC-docs way every other Mathcad-keybinding claim in
    // this file was).
    //
    // "for"/"while"/"if"/"otherwise"/"∈" are rendered as plain static
    // text labels (.program-label), never typed into a MathQuill field
    // at all — the same established pattern a graph line's own "y ="
    // label (.graph-ylabel) already uses. This was a deliberate choice,
    // not an oversight of the "check whether MathQuill's
    // autoOperatorNames mechanism already covers these" question the
    // spec raised: reusing the label pattern sidesteps that whole
    // question (and the real risk behind it — autoOperatorNames can't be
    // safely extended in place, see the comment by `var MQ` above) for
    // every one of these keywords at once, with no MathQuill-recognition
    // risk at all.

    // Finds the identifier a plain assign/return statement's field
    // should be focused with `.focus()`, or the matching header field
    // for a for/while/if — the one place that knows "which field does
    // this role name mean" so programFieldList()/onProgramMoveOutOf()
    // don't each need their own copy of this mapping.
    function programFieldFor(stmt, role) {
      if (role === "expr") return stmt.field;
      if (role === "var") return stmt.varField;
      if (role === "coll") return stmt.collField;
      if (role === "cond") return stmt.condField;
      return null;
    }

    // Walks the whole statement tree once, in reading order, into a flat
    // [{stmt, role}, ...] list — see this section's header comment for
    // why this is the whole navigation model. Recurses into a for/while's
    // `body` or an if's `thenBody`/`elseBody` unconditionally, so this
    // already handles arbitrary nesting depth (a nested for/while/if
    // inside another), not just one level.
    function programFieldList(progLine) {
      var list = [];
      function walk(stmts) {
        for (var i = 0; i < stmts.length; i++) {
          var s = stmts[i];
          if (s.kind === "assign" || s.kind === "return") list.push({ stmt: s, role: "expr" });
          else if (s.kind === "for") { list.push({ stmt: s, role: "var" }); list.push({ stmt: s, role: "coll" }); walk(s.body); }
          else if (s.kind === "while") { list.push({ stmt: s, role: "cond" }); walk(s.body); }
          else if (s.kind === "if") { list.push({ stmt: s, role: "cond" }); walk(s.thenBody); walk(s.elseBody); }
          // break/continue contribute no field at all.
        }
      }
      walk(progLine.statements);
      return list;
    }
    function programFieldIndex(progLine, stmt, role) {
      var list = programFieldList(progLine);
      for (var i = 0; i < list.length; i++) if (list[i].stmt === stmt && list[i].role === role) return i;
      return -1;
    }

    // Finds which list (progLine.statements itself, or some ancestor
    // for/while's `body`/if's `thenBody`/`elseBody`, at any depth)
    // currently holds `targetStmt`, plus its index and the DOM element
    // new siblings should be inserted relative to — the one place Enter/
    // Backspace/insertStructural() below all go to answer "where exactly
    // does this statement live". Written as plain recursion rather than
    // a hard-coded "check top level, then check one level of bodies", so
    // it already resolves a statement nested at any depth correctly.
    function locateStatement(progLine, targetStmt) {
      function search(list, parentEl) {
        for (var i = 0; i < list.length; i++) {
          if (list[i] === targetStmt) return { list: list, index: i, parentEl: parentEl };
          var s = list[i];
          var found = null;
          if (s.kind === "for" || s.kind === "while") found = search(s.body, s.bodyEl);
          else if (s.kind === "if") found = search(s.thenBody, s.thenEl) || search(s.elseBody, s.elseEl);
          if (found) return found;
        }
        return null;
      }
      return search(progLine.statements, progLine.bodyEl);
    }

    // Allocates a fresh statement object of the given kind, with empty
    // (not-yet-rendered) body arrays for a structural kind — matches
    // exactly the shape runProgram()/runStatement() above already
    // expect; `.el`/`.field`/etc. are filled in by renderStatement()
    // once this is actually placed into the DOM.
    function createStatementObject(kind) {
      if (kind === "assign" || kind === "return") return { kind: kind, el: null, field: null };
      if (kind === "break" || kind === "continue") return { kind: kind, el: null };
      if (kind === "for") return { kind: "for", el: null, varField: null, collField: null, body: [] };
      if (kind === "while") return { kind: "while", el: null, condField: null, body: [] };
      if (kind === "if") return { kind: "if", el: null, condField: null, thenBody: [], elseBody: [] };
    }

    // Creates one MathQuill field for a single statement-tree slot
    // (a plain assign/return statement's own expression, or one of a
    // for/while/if header's var/collection/condition fields) and wires
    // its Enter/Backspace/Left-Right the same way every other MathQuill
    // field in this app does — the program-tree equivalent of
    // addCellToRow()'s per-cell field setup. `containerEl._progField` is
    // the back-reference the global keydown listener's
    // resolveProgramField() (and resolveMathField(), for Greek
    // letters/the integral trigger) resolve a raw DOM event target
    // through — the same role cellEl._line/_row/_col plays for a matrix
    // cell, just carrying the statement/role pair instead of a row/
    // column index.
    function createProgramField(containerEl, progLine, stmt, role) {
      containerEl.className = "program-field";
      var field = MQ.MathField(containerEl, {
        handlers: {
          enter: function () { onProgramEnter(progLine, stmt, role); },
          deleteOutOf: function (dir) { onProgramDeleteOutOf(progLine, stmt, role, dir); },
          moveOutOf: function (dir) { onProgramMoveOutOf(progLine, stmt, role, dir); },
          edit: function () { completionOnFieldEdited(field); }
        }
      });
      containerEl._progField = { progLine: progLine, stmt: stmt, role: role, field: field };
      return field;
    }

    // Builds (or rebuilds, for a newly-inserted statement) one
    // statement's DOM row, inserted into `parentEl` right before
    // `beforeEl` (appended at the end when `beforeEl` is null/undefined)
    // — recurses into a for/while's `body`/an if's `thenBody`/
    // `elseBody` to render any statements the new structural statement
    // was created with already. In practice this recursion is shallow
    // on any single call (insertStructural() below always gives a
    // brand-new for/while/if exactly one starter assign statement, never
    // a nested structural one), but nothing about this function assumes
    // that — it recurses unconditionally, so rendering a deeply-nested
    // tree (e.g. one rebuilt from a saved document) works unchanged.
    function renderStatement(progLine, stmt, parentEl, beforeEl) {
      var row = document.createElement("div");
      row.className = "program-stmt program-stmt-" + stmt.kind;
      stmt.el = row;
      if (beforeEl) parentEl.insertBefore(row, beforeEl); else parentEl.appendChild(row);

      function label(text) {
        var l = document.createElement("span");
        l.className = "program-label";
        l.textContent = text;
        row.appendChild(l);
      }
      function fieldSlot() {
        var s = document.createElement("span");
        row.appendChild(s);
        return s;
      }
      function nestedBody(stmts) {
        var nested = document.createElement("div");
        nested.className = "program-body-nested";
        row.appendChild(nested);
        stmts.forEach(function (s) { renderStatement(progLine, s, nested, null); });
        return nested;
      }

      if (stmt.kind === "assign") {
        stmt.field = createProgramField(fieldSlot(), progLine, stmt, "expr");
      } else if (stmt.kind === "return") {
        label("return");
        stmt.field = createProgramField(fieldSlot(), progLine, stmt, "expr");
      } else if (stmt.kind === "break") {
        label("break");
      } else if (stmt.kind === "continue") {
        label("continue");
      } else if (stmt.kind === "for") {
        label("for");
        stmt.varField = createProgramField(fieldSlot(), progLine, stmt, "var");
        label("∈"); // Mathcad's own for-each binding symbol (TODO.md)
        stmt.collField = createProgramField(fieldSlot(), progLine, stmt, "coll");
        stmt.bodyEl = nestedBody(stmt.body);
      } else if (stmt.kind === "while") {
        label("while");
        stmt.condField = createProgramField(fieldSlot(), progLine, stmt, "cond");
        stmt.bodyEl = nestedBody(stmt.body);
      } else if (stmt.kind === "if") {
        label("if");
        stmt.condField = createProgramField(fieldSlot(), progLine, stmt, "cond");
        stmt.thenEl = nestedBody(stmt.thenBody);
        label("otherwise");
        stmt.elseEl = nestedBody(stmt.elseBody);
      }
      return row;
    }

    // Enter: see this section's header comment for the two different
    // meanings this has depending on what's focused.
    function onProgramEnter(progLine, stmt, role) {
      if (role === "var" || role === "coll" || role === "cond") {
        var targetList = stmt.kind === "if" ? stmt.thenBody : stmt.body;
        var targetEl = stmt.kind === "if" ? stmt.thenEl : stmt.bodyEl;
        if (targetList.length === 0) {
          var first = createStatementObject("assign");
          targetList.push(first);
          renderStatement(progLine, first, targetEl, null);
          first.field.focus();
        } else {
          programFieldFor(targetList[0], "expr").focus();
        }
        return;
      }
      var loc = locateStatement(progLine, stmt);
      if (!loc) return;
      var next = createStatementObject("assign");
      loc.list.splice(loc.index + 1, 0, next);
      renderStatement(progLine, next, loc.parentEl, stmt.el.nextSibling);
      next.field.focus();
    }

    // "Untouched since insertion" check for one for/while/if body list —
    // true only when it's still exactly the single starter "assign"
    // statement createStatementObject()/insertStructural() always seed a
    // brand-new structure's body (or thenBody/elseBody) with, and that
    // statement's own field is still empty too. Shared because
    // isStructurePristine() below needs this same check 1-2 times per
    // structure kind (once for `for`/`while`'s body, twice for `if`'s
    // thenBody+elseBody).
    function isStructureBodyPristine(bodyList) {
      return bodyList.length === 1 && bodyList[0].kind === "assign" &&
        bodyList[0].field.latex() === "";
    }

    // True only when NOTHING has been typed anywhere in this structure
    // since it was inserted — every header field still empty AND its
    // body/bodies still exactly the untouched starter statement above.
    // This is what onProgramDeleteOutOf() below gates "delete the whole
    // structure" on: see its header comment for why pristine-only, not
    // "always delete on an empty header field".
    function isStructurePristine(stmt) {
      if (stmt.kind === "for") {
        return stmt.varField.latex() === "" && stmt.collField.latex() === "" &&
          isStructureBodyPristine(stmt.body);
      }
      if (stmt.kind === "while") {
        return stmt.condField.latex() === "" && isStructureBodyPristine(stmt.body);
      }
      if (stmt.kind === "if") {
        return stmt.condField.latex() === "" &&
          isStructureBodyPristine(stmt.thenBody) && isStructureBodyPristine(stmt.elseBody);
      }
      return false;
    }

    // Removes `stmt` itself (whole subtree, for a structural kind) and
    // refocuses the previous entry in reading order — shared by
    // onProgramDeleteOutOf()'s two callers below (a plain assign/return/
    // break/continue statement removing itself, or a pristine for/
    // while/if structure removing itself wholesale). `role` is whichever
    // field Backspace was actually pressed in (the statement's own
    // field for "expr", or the structure's first header field for "var"/
    // "cond") — that's the field programFieldList() positions the
    // "previous entry" relative to, computed BEFORE removal so the index
    // still reflects the pre-removal tree.
    function deleteStatementAndFocusPrev(progLine, stmt, role) {
      var loc = locateStatement(progLine, stmt);
      if (!loc) return;
      if (loc.parentEl === progLine.bodyEl && progLine.statements.length === 1) {
        focusLine(revertProgramToPending(progLine), true);
        return;
      }
      var flist = programFieldList(progLine);
      var fidx = programFieldIndex(progLine, stmt, role);
      var prevEntry = fidx > 0 ? flist[fidx - 1] : null;
      stmt.el.remove();
      loc.list.splice(loc.index, 1);
      if (prevEntry) programFieldFor(prevEntry.stmt, prevEntry.role).focus();
      else { var i1 = indexOf(progLine); focusLine(i1 > 0 ? lines[i1 - 1] : progLine, true); }
    }

    // Backspace-when-empty: a plain assign/return statement (role ===
    // "expr"; break/continue have no field to even call this from) always
    // removes itself. A for/while/if's FIRST header field ("var" for
    // `for`, "cond" for `while`/`if`) removes the WHOLE structure too,
    // but only when isStructurePristine() says nothing has been typed
    // into it anywhere yet — see the section header comment for why this
    // is deliberately narrower than "any empty header field deletes".
    // Every other header field (a `for`'s second field, "coll") just
    // moves focus to the previous field, same as always — intra-
    // structure navigation, never a deletion gesture.
    function onProgramDeleteOutOf(progLine, stmt, role, dir) {
      if (dir !== MQ.L) return;
      if (role === "expr") {
        deleteStatementAndFocusPrev(progLine, stmt, role);
        return;
      }
      var isFirstHeaderField = (stmt.kind === "for" && role === "var") ||
        ((stmt.kind === "while" || stmt.kind === "if") && role === "cond");
      if (isFirstHeaderField && isStructurePristine(stmt)) {
        deleteStatementAndFocusPrev(progLine, stmt, role);
        return;
      }
      var list0 = programFieldList(progLine);
      var idx0 = programFieldIndex(progLine, stmt, role);
      if (idx0 > 0) programFieldFor(list0[idx0 - 1].stmt, list0[idx0 - 1].role).focus();
      else { var i0 = indexOf(progLine); if (i0 > 0) focusLine(lines[i0 - 1], true); }
    }

    // Left/Right at a field's edge: step to the adjacent entry in
    // reading order, or out to the notebook line above/below at either
    // end of the whole program — see this section's header comment.
    function onProgramMoveOutOf(progLine, stmt, role, dir) {
      var list = programFieldList(progLine);
      var idx = programFieldIndex(progLine, stmt, role);
      if (dir === MQ.L) {
        if (idx > 0) programFieldFor(list[idx - 1].stmt, list[idx - 1].role).focus();
        else { var i = indexOf(progLine); if (i > 0) focusLine(lines[i - 1], true); }
      } else if (dir === MQ.R) {
        if (idx < list.length - 1) programFieldFor(list[idx + 1].stmt, list[idx + 1].role).focus();
        else { var i2 = indexOf(progLine); if (i2 < lines.length - 1) focusLine(lines[i2 + 1]); }
      }
    }

    // Reverses convertToProgram()/convertMathToProgram(): turns the (now
    // fully emptied) program line back into a plain pending line — the
    // program-block equivalent of revertToPending() above for an emptied
    // 1x1 matrix.
    function revertProgramToPending(line) {
      var el = document.createElement("div");
      el.className = "line pending";
      el.contentEditable = "true";
      el.spellcheck = false;
      line.el.replaceWith(el);
      line.el = el;
      line.type = "pending";
      el._line = line;
      delete line.statements;
      delete line.bodyEl;
      delete line.fnName;
      delete line.fnParams;
      wireLineKeydown(line);
      wirePendingInput(line);
      return line;
    }

    // Shared by convertToProgram() (bare, "{" on a pending line) and
    // convertMathToProgram() (a function body, "{" on a math line
    // already showing exactly "f(x):=") — builds the brace+body DOM
    // (see this section's header comment on why a single CSS border
    // bracket, reusing the matrix bracket's own look, stands in for a
    // real curly brace) and, when `fnName` is given, a "f(x) := " label
    // in front of it, mirroring how a named matrix's own label
    // (matrix-name-label) sits in front of ITS bracket+grid. Does not
    // add any statements itself — both callers follow this with one
    // starter "assign" statement, the same way buildMatrixContainer()'s
    // own callers always follow it with a starter row+cell.
    function buildProgramContainer(line, fnName, fnParams) {
      var container = document.createElement("div");
      container.className = "line program-line";
      line.el.replaceWith(container);
      line.el = container;
      line.type = "program";
      line.statements = [];
      line.fnName = fnName || null;
      line.fnParams = fnParams || null;
      container._line = line;

      if (line.fnName) {
        var nameLabel = document.createElement("span");
        nameLabel.className = "matrix-name-label";
        nameLabel.textContent = line.fnName + "(" + line.fnParams.join(", ") + ") := ";
        container.appendChild(nameLabel);
      }

      var bracket = document.createElement("div");
      bracket.className = "matrix-bracket matrix-bracket-left program-bracket";
      var body = document.createElement("div");
      body.className = "program-body";
      container.appendChild(bracket);
      container.appendChild(body);
      line.bodyEl = body;
    }

    // Bare program block: Mathcad has no bare-key convention for this at
    // all (see §8's own note, confirmed before picking anything) — "{"
    // was the proposed, unclaimed shortcut and stayed unclaimed through
    // this feature's own build, so it's used as proposed. Triggered from
    // a pending line exactly like "[" (matrix)/"@" (graph) above it in
    // wirePendingInput().
    function convertToProgram(line) {
      buildProgramContainer(line, null, null);
      var first = createStatementObject("assign");
      line.statements.push(first);
      renderStatement(line, first, line.bodyEl, null);
      first.field.focus();
    }

    // A program block AS A FUNCTION BODY: "{" typed on a math line
    // already showing exactly "f(x):=" (or "f(x,y):=", ...) and nothing
    // else — see the global keydown listener's own "{" handling further
    // below, the direct analogue of "[" converting "A:=" into a named
    // matrix. §1 of the spec: this is what lets collectDefinitions()
    // register `name` as a program-backed function (see its own "program"
    // case above) instead of the usual LaTeX-string-bodied one.
    function convertMathToProgram(line, name, params) {
      buildProgramContainer(line, name, params);
      var first = createStatementObject("assign");
      line.statements.push(first);
      renderStatement(line, first, line.bodyEl, null);
      first.field.focus();
    }

    // Mirrors the "[" matrix-naming check in the global keydown listener
    // below: recognizes "f(x):=" typed so far on a math line, with
    // NOTHING else yet. Deliberately its OWN small duplicate parser
    // (same convention parseLatexToTree() already established — see its
    // header comment — of copying a small grammar fragment rather than
    // reaching into collectDefinitions()'s own private inline version of
    // this exact same function-signature check) instead of refactoring
    // that working code to share this.
    function matchFunctionSignatureSoFar(latex) {
      var lhs = parseDefinitionLHS(latex);
      if (!lhs) return null;
      var afterName = lhs.rest;
      var usesLeft = afterName.indexOf("\\left(") === 0;
      if (!usesLeft && afterName[0] !== "(") return null;
      var afterParen = afterName.slice(usesLeft ? 6 : 1);
      var params = [];
      for (;;) {
        var p = matchIdentifierAt(afterParen, 0);
        if (p === null) return null;
        params.push(p);
        afterParen = afterParen.slice(p.length);
        if (afterParen[0] === ",") { afterParen = afterParen.slice(1); continue; }
        break;
      }
      var closeLit = usesLeft ? "\\right)" : ")";
      if (afterParen.indexOf(closeLit) !== 0) return null;
      var afterClose = afterParen.slice(closeLit.length);
      return afterClose === ":=" ? { name: lhs.name, params: params } : null;
    }

    // Inserts a brand-new for/while/if structure right after whichever
    // statement currently contains the focused field, with one starter
    // "assign" statement already in its body (so there's somewhere for
    // the cursor to land next via Enter, same as a brand-new matrix
    // starting with one empty cell). Nesting is unrestricted (TODO.md's
    // original v1 cap — "one level of nesting only", "at most one for/
    // while", "at most one if" — was lifted): this works identically
    // whether the focused field belongs to the program's own top-level
    // statement list or to any for/while's `body`/if's `thenBody`/
    // `elseBody`, at any depth, and any number of for/while/if structures
    // can coexist at the same level. The only reason this function could
    // be this small is that locateStatement() already resolves `loc.list`/
    // `loc.parentEl` to whichever list/element actually contains the
    // focused statement, nested or not — every other piece of this
    // feature (runStatement()'s recursion, programFieldList()'s walk(),
    // renderStatement()'s nestedBody(), locateStatement() itself) was
    // already written as plain unconditional recursion from the start,
    // specifically so lifting this cap would be a one-function change.
    function insertStructural(progLine, atStmt, kind) {
      var loc = locateStatement(progLine, atStmt);
      if (!loc) return;
      var stmt = createStatementObject(kind);
      // Both branches of an "if" need their own starter row — found
      // live: seeding only thenBody left elseBody permanently empty
      // with no way to focus/add a row into it at all (onProgramEnter's
      // "cond" case only ever routes Enter into thenBody, never
      // elseBody, so an elseBody that starts empty can never gain its
